<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Staff with a large suspended spherical jingle bell">
  <title>Jingle-bell staff</title>
  <!-- Staff grip, bent hook, hanging string and one oversized round bell. -->
  <path d="M16 60V9" fill="none" stroke="#684831" stroke-width="6" stroke-linecap="round"/>
  <path d="M16 9Q16 2 26 4Q39 3 42 13" fill="none" stroke="#d5ad66" stroke-width="4.8" stroke-linecap="round"/>
  <path d="M41 13V22" fill="none" stroke="#ffe6ab" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="41" cy="40" r="18" fill="#d6a55a" stroke="#6b4933" stroke-width="2"/>
  <path d="M27 37Q34 24 47 28" fill="none" stroke="#fff0c4" stroke-opacity=".8" stroke-width="4" stroke-linecap="round"/>
  <!-- Two cut-out slits and rattle opening: deliberately NOT a handbell profile. -->
  <path d="M28 44Q41 49 54 44M41 29V52" fill="none" stroke="#6b4831" stroke-width="3" stroke-linecap="round"/>
  <circle cx="41" cy="52" r="3.2" fill="#63412c"/>
  <path d="M11 46L21 42M11 52L21 49" stroke="#d8ad71" stroke-width="1.5" stroke-linecap="round"/>
</svg>

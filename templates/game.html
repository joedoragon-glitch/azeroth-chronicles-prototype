<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102319"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Azeroth"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Azeroth Chronicles</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles/prototype.css"><link rel="stylesheet" href="./styles/desktop.css"><link rel="stylesheet" href="./styles/phone.css"></head>
<body data-entry="{{ENTRY}}"><canvas id="world" aria-label="Isometric adventure world"></canvas>
<aside id="hud"><button id="menu-button" aria-label="Open game menu">☰ Menu <small>Esc</small></button><h1>Azeroth Chronicles</h1><div id="hero-stats"></div><div id="location"></div><div id="objective"></div><div id="status" role="status"></div><button id="talent-button" aria-label="Open discipline training">Training · <span id="talent-count">0</span> <small>C</small></button><button id="squad-button" hidden>Squad doctrine <small>Tab</small></button><button id="recall-button">Recall squad <small>`</small></button></aside>
<div id="message" role="status" aria-live="polite" aria-atomic="true"></div><div id="stamina-status" hidden></div><button id="sprint-button" hidden>Sprint · Q</button><div id="skills" aria-label="Skills"></div>
<div id="desktop-hints">WASD · Move &nbsp; E / F · Interact &nbsp; Z · Map &nbsp; I · Inventory &nbsp; Esc · Menu</div>
<div id="movement"><div id="joystick" role="button" tabindex="0" aria-label="Move hero"><div id="stick"></div></div><button id="touch-interact-button" aria-label="Interact">F<br><small>Interact</small></button><button id="order-button">Confirm<br><small>F</small></button></div>
<section id="modal" hidden aria-modal="true" role="dialog" aria-labelledby="modal-title"><h2 id="modal-title"></h2><div id="modal-description"></div><div id="modal-actions"></div><button id="close-button">Back <small>F / Esc</small></button></section>
<input id="import-file" type="file" accept="application/json,.json" hidden>

</body></html>

name: Check game
description: Shared full Node and Chromium checks for pull requests and main.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install locked development tools
      shell: bash
      run: npm ci --ignore-scripts
    - name: Check formatting
      id: formatting
      # Keep the release gate strict, but don't let historical formatter drift
      # hide game-regression results from the same overnight audit.
      continue-on-error: true
      shell: bash
      run: npm run format:check
    - name: Check generated entries and all published JavaScript
      id: source_checks
      continue-on-error: true
      shell: bash
      run: npm run check
    - name: Full regression suite
      id: node_regressions
      continue-on-error: true
      shell: bash
      run: npm test
    - name: Observe combined hero skill balance
      id: hero_balance
      continue-on-error: true
      shell: bash
      run: node scripts/combined-skill-balance.cjs test-results/combined-validation/balance.json
    - name: Verify performance equivalence when present
      id: perf_equivalence
      continue-on-error: true
      if: hashFiles('tests/perf-v09-protected.test.cjs') != ''
      shell: bash
      run: |
        git fetch --depth=1 origin c6ce1af236bddd7ca881903499c4cf5de175f9e2
        mkdir -p "$RUNNER_TEMP/perf-v09-baseline"
        git archive c6ce1af236bddd7ca881903499c4cf5de175f9e2 | tar -x -C "$RUNNER_TEMP/perf-v09-baseline"
        git fetch --depth=1 origin 9d302c41d991f523bada4c4f24ea68fd45ce03dc
        mkdir -p "$RUNNER_TEMP/combined-simulation-baseline"
        git archive 9d302c41d991f523bada4c4f24ea68fd45ce03dc | tar -x -C "$RUNNER_TEMP/combined-simulation-baseline"
        COMBINED_SIMULATION_ROOT="$RUNNER_TEMP/combined-simulation-baseline" node --expose-gc scripts/perf-v09-equivalence.cjs "$RUNNER_TEMP/perf-v09-baseline"
    - name: Reproduce cooldown balance evidence summary
      id: cooldown_summary
      continue-on-error: true
      shell: bash
      run: |
        python3 scripts/summarize-cooldown-balance.py docs/evidence/COOLDOWN_BALANCE_20261009.json.gz "$RUNNER_TEMP/cooldown-summary.json"
        cmp docs/evidence/COOLDOWN_BALANCE_20261009_SUMMARY.json "$RUNNER_TEMP/cooldown-summary.json"
    - name: Use runner Chrome for full browser matrix
      id: browser_setup
      continue-on-error: true
      shell: bash
      run: |
        CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
        if [ -n "$CHROME" ]; then
          echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
        else
          npx playwright install chromium
        fi
    - name: Test full desktop and mobile matrix
      id: browser_matrix
      continue-on-error: true
      shell: bash
      run: node tests/prototype-browser.test.cjs
    - name: Exercise optional PixiJS renderer and safe Canvas fallback
      id: pixi_renderer
      continue-on-error: true
      shell: bash
      run: node tests/pixi-renderer-browser.test.cjs
    - name: Verify FPS settings and rendering-only scheduling
      id: fps_check
      continue-on-error: true
      shell: bash
      run: node tests/frame-rate-browser.test.cjs
    - name: Verify cooldown charge queues and save upgrade
      id: save_upgrade
      continue-on-error: true
      shell: bash
      run: |
        node tests/cooldown-input-browser.test.cjs
        git fetch --depth=1 origin 01238bddc8dde4dafe99ba50148d944141373f49
        mkdir -p "$RUNNER_TEMP/cooldown-v118"
        git archive 01238bddc8dde4dafe99ba50148d944141373f49 | tar -x -C "$RUNNER_TEMP/cooldown-v118"
        COOLDOWN_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" node tests/cooldown-pwa-upgrade-browser.test.cjs
        mkdir -p test-results/beta-historical
        BETA_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" BETA_FIXTURE_DIR=test-results/beta-historical node scripts/beta-history-audit.cjs > test-results/beta-history-report.json
        BETA_FIXTURE_DIR=test-results/beta-historical node tests/beta-campaign-browser.test.cjs
    - name: Verify quest completion and Keeper Archive interaction
      id: quest_archive
      continue-on-error: true
      shell: bash
      run: |
        node tests/quest-archive-browser.test.cjs
        node tests/archive-a5-browser.test.cjs
    - name: Audit integrated rogue warnings and effects in browsers
      id: rogue_browser
      continue-on-error: true
      shell: bash
      run: node tests/rogue-browser.test.cjs
    - name: Verify audio playback and lifecycle
      id: audio_browser
      continue-on-error: true
      shell: bash
      run: |
        hero_av_status=0
        node tests/hero-skills-browser.test.cjs || hero_av_status=1
        node tests/audio-browser.test.cjs || hero_av_status=1
        node tests/audio-audition-browser.test.cjs || hero_av_status=1
        exit "$hero_av_status"
    - name: Verify Community Snapshot pets and native procedural scenes
      id: community_browser
      continue-on-error: true
      shell: bash
      run: |
        node tests/personalization-browser.test.cjs
        node tests/community-snapshot-browser.test.cjs
    - name: Verify original-master actor idles and combat
      id: sprite_browser
      continue-on-error: true
      shell: bash
      run: |
        node scripts/sprite-production-browser-review.cjs local test-results/sprite-pilot-ci chromium
        node scripts/sprite-nature-browser-review.cjs local test-results/sprite-nature-ci chromium
    - name: Verify terrain material rendering
      id: terrain_browser
      continue-on-error: true
      shell: bash
      run: |
        node tests/materials-browser.test.cjs
        node tests/ground-cache-browser.test.cjs
    - name: Verify full enemy VFX catalog and pilot captures
      id: vfx_browser
      continue-on-error: true
      shell: bash
      run: |
        node tests/enemy-vfx-browser.test.cjs
        VFX_CAPTURE_TAG=ci VFX_CAPTURE_SMOKE=1 VFX_CAPTURE_VISUAL_ONLY=1 node scripts/enemy-vfx-capture.cjs
    - name: Verify Chromium performance changes when present
      id: chromium_perf
      continue-on-error: true
      if: hashFiles('tests/perf-v09-protected.test.cjs') != ''
      shell: bash
      env:
        MATERIAL_BROWSER_ENGINE: chromium
        PERF_WS2_BROWSER_ENGINE: chromium
      run: |
        node tests/perf-ws1-roads-browser.test.cjs
        node tests/perf-ws2-occlusion-browser.test.cjs
        PERF_WS2_BASELINE_ROOT="$RUNNER_TEMP/perf-v09-baseline" node scripts/perf-ws2-renderer-performance.cjs test-results/perf/combined-chromium.json
    - name: Verify development sprite showroom
      id: sprite_showroom
      continue-on-error: true
      shell: bash
      run: node tests/sprite-showroom-browser.test.cjs
    - name: Capture native snapshot visual audit
      id: snapshot_visuals
      continue-on-error: true
      shell: bash
      run: node scripts/snapshot-certification-visuals.cjs
    - name: Enforce every required check before release certification
      if: always()
      shell: bash
      env:
        SNAPSHOT_CHECK_STATES: ${{ toJSON(steps) }}
      run: |
        node <<'NODE'
        const states = JSON.parse(process.env.SNAPSHOT_CHECK_STATES || '{}');
        const essential = ['formatting', 'source_checks', 'node_regressions', 'pixi_renderer'];
        const failed = Object.entries(states)
          .filter(([name, value]) => value.outcome === 'failure')
          .map(([name]) => name);
        for (const id of essential)
          if (states[id]?.outcome !== 'success' && !failed.includes(id)) failed.push(id);
        if (failed.length) {
          console.error('::error::Snapshot certification blocked by: ' + failed.join(', '));
          process.exit(1);
        }
        console.log('All required checks passed; separate PR release authorization still needed.');
        NODE

name: Temporary Boss Pitstop Regression Sweep
on:
  push:
    branches: [feature/boss-identity-pitstop-20261011]
permissions:
  contents: read
jobs:
  audit-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Execute independent regression suites and collect failures
        shell: bash
        run: |
          failed=0
          total=0
          for file in tests/prototype.test.cjs; do
            case "$file" in *browser*) continue;; esac
            total=$((total+1))
            if ! timeout 40s node "$file" > /tmp/boss-test.out 2>&1; then
              failed=$((failed+1))
              echo "===== FAILED: $file ====="
              grep -n -A18 '^FAIL ' /tmp/boss-test.out || tail -n 45 /tmp/boss-test.out
            fi
          done
          echo "TOTAL=$total FAILED=$failed"
          test "$failed" -eq 0
      - name: Print protected-file hashes for audit
        run: |
          sha256sum src/prototype/{engine,party,combat,hero-combat,boss-combat,rules,data,save}.js
          node scripts/sprite-scope-audit.cjs --check

name: v0.9.2 nearby basic target retention audit (no deployment)

on:
  push:
    branches: [fix/v092-hero-auto-basic-nearby-fallback-20261116]

permissions:
  contents: write

jobs:
  combat:
    name: Native four-class targeting and cooldown regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm source and test syntax
        run: |
          node --check src/prototype/hero-combat.js
          node --check tests/v092-hero-auto-basic-target-fallback.test.cjs
      - name: Four-class owner-approved nearby fallback
        run: node tests/v092-hero-auto-basic-target-fallback.test.cjs
      - name: Reconcile historical targeting suite against original main
        run: |
          git fetch --no-tags --depth=1 origin bd967ac4c4d0870262d547ee2cbcde5b79c31c5d
          git worktree add --detach /tmp/v092-targeting-base bd967ac4c4d0870262d547ee2cbcde5b79c31c5d
          set +e
          (cd /tmp/v092-targeting-base && node tests/targeting.test.cjs) > /tmp/targeting-base.log 2>&1
          base_rc=$?
          node tests/targeting.test.cjs > /tmp/targeting-candidate.log 2>&1
          candidate_rc=$?
          set -e
          echo "Original main exit: $base_rc"
          echo "Candidate exit: $candidate_rc"
          base_error=$(grep -m1 'AssertionError' /tmp/targeting-base.log || true)
          candidate_error=$(grep -m1 'AssertionError' /tmp/targeting-candidate.log || true)
          echo "Original main first failure: $base_error"
          echo "Candidate first failure: $candidate_error"
          if [ "$base_rc" -eq 0 ]; then
            test "$candidate_rc" -eq 0
          else
            test "$candidate_rc" -ne 0
            test -n "$base_error"
            test "$candidate_error" = "$base_error"
            echo "BASELINE-RED historical targeting test; first failure matches unchanged main. Not a PASS claim."
          fi
      - name: Skill, rogue and Slow engine regression
        run: |
          node tests/hero-skill1-stage1.test.cjs
          node tests/rogue-hero-phase2.test.cjs
          node tests/slow-cooldown.test.cjs
          node tests/hero-skill1-integration.test.cjs
      - name: Check new test formatting, regenerate worker and verify build
        run: |
          npm ci --ignore-scripts
          npx prettier --check tests/v092-hero-auto-basic-target-fallback.test.cjs
          git diff --check
          node scripts/build.cjs
          node scripts/build.cjs --check
          git diff --check
      - name: Commit matching offline worker fingerprint to isolated review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          unexpected=$(git diff --name-only | grep -Ev '^(src/prototype/hero-combat.js|tests/v092-hero-auto-basic-target-fallback.test.cjs|sw.js)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated source changes: $unexpected"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "build(combat): synchronize narrow auto fallback PWA fingerprint [skip ci]"
            git push origin HEAD:refs/heads/fix/v092-hero-auto-basic-nearby-fallback-20261116
          fi

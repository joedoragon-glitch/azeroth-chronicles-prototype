name: VFX formatting diff (temporary)
on:
  pull_request:
    paths:
      - src/prototype/enemy-vfx.js
      - .github/workflows/vfx-format-preview.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Print exact formatter diff
        run: |
          npx prettier src/prototype/enemy-vfx.js > /tmp/enemy-vfx-formatted.js
          diff -u src/prototype/enemy-vfx.js /tmp/enemy-vfx-formatted.js || true

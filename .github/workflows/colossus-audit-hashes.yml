name: Temporary Colossus safety retest
on:
  push:
    paths:
      - '.github/workflows/colossus-audit-hashes.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - name: Runtime file hashes
        run: sha256sum src/prototype/data.js src/prototype/rules.js src/prototype/engine.js src/prototype/boss-combat.js src/prototype/save.js src/prototype/combat.js
      - name: Formatting diff
        run: |
          npx --no-install prettier --write src/prototype/rules.js src/prototype/engine.js src/prototype/boss-combat.js src/prototype/combat.js tests/colossus-biography.test.cjs
          git diff -- src/prototype/rules.js src/prototype/engine.js src/prototype/boss-combat.js src/prototype/combat.js tests/colossus-biography.test.cjs
      - name: Focused live scenarios
        run: node tests/colossus-biography.test.cjs

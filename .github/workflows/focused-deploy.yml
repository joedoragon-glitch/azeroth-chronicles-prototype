name: Focused checks and deploy

# Owner policy: automatic updates must never launch full-game or browser matrices.
# Comprehensive certification lives in pages.yml and requires manual opt-in.
on:
  push:
    # Isolated environmental-audio draft: focused validation only, never Pages.
    branches: [main, 'audit/environment-709-evidence-*']
  pull_request:
    # Stacked Archive drafts need checks without retargeting them onto main.
    branches: [main, 'archive/**', 'narrative/**']

permissions:
  contents: read

concurrency:
  group: focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Make the exact comparison commit available
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CI_BASE_SHA" ] && [[ ! "$CI_BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${CI_BASE_SHA}^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi
      - name: Validate game version and current documentation before publishing
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node tests/docs-release-consistency.test.cjs
          node scripts/docs-release-consistency.cjs
      # The ordinary focused runner intentionally omits audio tooling by default.
      # Install true MP3 decoders only when an audio-affecting PR selects
      # acoustic/signal tests. Never weaken those tests to synthetic/no-op passes.
      - name: Provide FFmpeg/FFprobe for impacted physical-audio tests
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if git diff --name-only "$CI_BASE_SHA" HEAD |
             grep -Eq '^(assets/audio/|tools/audio/|src/prototype/audio-|tests/(audio-|environment-audio-)|docs/AUDIO_)'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
            command -v ffmpeg
            command -v ffprobe
          fi
      - name: Check only impacted subsystems
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/focused-ci.cjs
      - name: Preserve focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ci-evidence
          path: ${{ runner.temp }}/azeroth-focused-ci-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify reproducible, offline-ready build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/build.cjs --check --site
          else
            node scripts/build.cjs --check
          fi
      - name: Upload validated Pages package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish focused update
    needs: focused
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy focused, verified build
        id: publish
        uses: actions/deploy-pages@v4
      - name: Report published commit
        run: echo "Published focused update ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

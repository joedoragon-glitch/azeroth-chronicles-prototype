name: Focused checks and deploy

# Owner policy: automatic updates must never launch full-game or browser matrices.
# Comprehensive certification lives in pages.yml and requires manual opt-in.
on:
  push:
    branches: [main]
  pull_request:
    # Stacked Archive drafts need checks without retargeting them onto main.
    branches: [main, 'archive/**', 'narrative/**']

permissions:
  contents: read

concurrency:
  group: focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Focused validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Make the exact comparison commit available
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CI_BASE_SHA" ] && [[ ! "$CI_BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "${CI_BASE_SHA}^{commit}" 2>/dev/null ||
              git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi
      - name: Validate game version and current documentation before publishing
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node tests/docs-release-consistency.test.cjs
          node scripts/docs-release-consistency.cjs
      - name: Check only impacted subsystems
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/focused-ci.cjs
      - name: Preserve focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-ci-evidence
          path: ${{ runner.temp }}/azeroth-focused-ci-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify reproducible, offline-ready build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/build.cjs --check --site
          else
            node scripts/build.cjs --check
          fi
      # Temporary, strictly PR-branch-scoped internal composition validation.
      # No live audio assets, service worker, or deployed game are changed.
      - name: Prepare Phase 2 internal renderer dependencies
        if: github.event_name == 'pull_request' && github.head_ref == 'audio/phase2-composition-pilots-20261030'
        run: |
          python3 -m venv "$RUNNER_TEMP/sibdlp-phase2-venv"
          "$RUNNER_TEMP/sibdlp-phase2-venv/bin/python" -m pip install --disable-pip-version-check --quiet 'numpy==2.2.6' 'scipy==1.16.1'
      - name: Render and decode isolated Phase 2 soundtrack pilots
        if: github.event_name == 'pull_request' && github.head_ref == 'audio/phase2-composition-pilots-20261030'
        run: |
          "$RUNNER_TEMP/sibdlp-phase2-venv/bin/python" tools/audio/phase2-composer.py --render "$RUNNER_TEMP/sibdlp-phase2-internal"
          "$RUNNER_TEMP/sibdlp-phase2-venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'sibdlp-phase2-internal/pilot-metrics.json').read_text())
          assert report['musicRegistered'] == 83
          assert report['crownFrozen'] == 18
          assert len(report['pilotStems']) == 8
          assert report['headroomAfterPilotProjectionBytes'] > 0, 'Encoded library exceeds 32 MiB after pilot projection'
          print('PILOT_RENDER_EVIDENCE=' + json.dumps(report, sort_keys=True), flush=True)
          PY
      - name: Preserve non-public Phase 2 internal pilot audio and measurements
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'audio/phase2-composition-pilots-20261030'
        uses: actions/upload-artifact@v4
        with:
          name: phase2-internal-pilot-previews
          path: ${{ runner.temp }}/sibdlp-phase2-internal/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated Pages package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish focused update
    needs: focused
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy focused, verified build
        id: publish
        uses: actions/deploy-pages@v4
      - name: Report published commit
        run: echo "Published focused update ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

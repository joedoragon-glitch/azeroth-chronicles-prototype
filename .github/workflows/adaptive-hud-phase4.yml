name: Adaptive HUD Phase 4 focused browser acceptance

# Narrow, owner-requested acceptance for the one ongoing HUD PR.
# Does not invoke the manual full-suite workflow and cannot deploy to Pages.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-hud-phase4.yml'
      - 'src/prototype/app.js'
      - 'src/prototype/input.js'
      - 'styles/phone.css'
      - 'tests/floating-joystick-browser.test.cjs'
      - 'tests/adaptive-mobile-hud-integration-browser.test.cjs'
      - 'tests/notification-refinement.test.cjs'

permissions:
  contents: read

concurrency:
  group: adaptive-hud-phase4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-mobile-hud:
    if: github.event.pull_request.number == 519
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tools
        run: npm ci --ignore-scripts
      - name: Ensure pinned PixiJS fallback assets
        run: node scripts/vendor-pixi.cjs --ensure
      - name: Install only Chromium and WebKit for HUD interaction
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium webkit
      - name: Verify real Chromium floating touch ownership
        timeout-minutes: 3
        run: node tests/floating-joystick-browser.test.cjs
      - name: Verify Chromium and WebKit integrated HUD
        timeout-minutes: 4
        run: node tests/adaptive-mobile-hud-integration-browser.test.cjs
      - name: Preserve phone HUD screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-hud-phase4-screenshots
          path: test-results/adaptive-hud-phase4/
          if-no-files-found: ignore
          retention-days: 3

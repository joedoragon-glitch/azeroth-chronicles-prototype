name: Greenwood roads and bridges — targeted real-scene review
# User-authorized focused visual QA. No broad browser matrix, merge or deploy.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/greenwood-road-bridge-preview.yml'
      - 'tools/greenwood-layout/browser-review.cjs'
      - 'tools/greenwood-layout/pixi-road-bridge-review.cjs'
      - 'src/prototype/greenwood-landscape.js'
      - 'src/prototype/visuals.js'
      - 'src/prototype/engine.js'
      - 'tests/greenwood-owner-architecture-feedback.test.cjs'
      - 'src/prototype/renderer.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: greenwood-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scenes:
    name: Real scene captures — ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [canvas, pixi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify roof topology, v4 open-yard migration and named arrival
        if: matrix.mode == 'canvas'
        run: |
          node tests/greenwood-owner-architecture-feedback.test.cjs
          node tests/greenwood-environment-quality.test.cjs
          node tests/greenwood-winter-estate.test.cjs
      - run: npx playwright install chromium --with-deps
      - name: Resolve exact local Chromium
        run: echo "CHROMIUM_EXECUTABLE=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Check exact production-source fingerprints
        run: node scripts/build.cjs --check
      - name: Capture Millhaven junctions and both complete bridge approaches at real 150 percent camera
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "pixi" ]]; then
            GREENWOOD_PREVIEW_OUT="test-artifacts/greenwood-road-bridge/pixi/desktop" node tools/greenwood-layout/pixi-road-bridge-review.cjs
            GREENWOOD_PREVIEW_OUT="test-artifacts/greenwood-road-bridge/pixi/phone-landscape" node tools/greenwood-layout/pixi-road-bridge-review.cjs --phone
          else
            node tools/greenwood-layout/browser-review.cjs --road-bridge-scenes --desktop-only --daytime --out "test-artifacts/greenwood-road-bridge/canvas/desktop"
            node tools/greenwood-layout/browser-review.cjs --road-bridge-scenes --landscape-only --daytime --out "test-artifacts/greenwood-road-bridge/canvas/phone-landscape"
          fi
      - name: Capture refined Treasury and homestead at actual native phone scale
        if: matrix.mode == 'canvas'
        run: node tools/greenwood-layout/environment-review.cjs
      - name: Preserve focused native architecture visual evidence
        if: matrix.mode == 'canvas'
        uses: actions/upload-artifact@v4
        with:
          name: greenwood-architecture-pr832-native
          path: |
            test-artifacts/greenwood-environment/scenes/homestead-day.png
            test-artifacts/greenwood-environment/scenes/homestead-night.png
            test-artifacts/greenwood-environment/scenes/treasury-day.png
            test-artifacts/greenwood-environment/scenes/treasury-night.png
            test-artifacts/greenwood-environment/scenes/receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Save exact-head Canvas and Pixi real-browser visual receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenwood-road-bridge-${{ matrix.mode }}
          path: test-artifacts/greenwood-road-bridge/${{ matrix.mode }}/
          retention-days: 30
          if-no-files-found: ignore

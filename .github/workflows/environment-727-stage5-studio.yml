# #727 Stage 5 four Treasury comparisons (two optional source masters). Studio only: no game registrations or publication.
name: Environmental Stage 5 two-treasury source studio (NO deploy)

on:
  push:
    branches:
      - 'audio/environment-727-stage5-*'
    paths:
      - 'tools/audio/environment-727-treasury-studies.json'
      - 'tools/audio/environment-727-treasury-studio.py'
      - 'tests/environment-727-stage5-source.test.cjs'
      - '.github/workflows/environment-727-stage5-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verified-studio:
    name: Source originals, two optional source-authored MP3 previews, strict decoded QA
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing audio math and production decoder tools
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Protect original catalog, sound events and all existing routing
        run: |
          node tests/environment-audio-inventory.test.cjs
          node tests/audio-production.test.cjs
      - name: Strict source-probe or encode the two previews when originals pinned
        run: |
          set -eu
          if python - <<'PY'
          import json,sys
          b=json.load(open('tools/audio/environment-727-treasury-studies.json'))
          if len(b['studies'])!=2 or len(b['sources'])!=4:
              sys.exit('Scope violation: two optional Treasury studies and four original source records required')
          pinned=all(isinstance(s.get('sha1'),str) and len(s['sha1'])==40 and
                     isinstance(s.get('sha256'),str) and len(s['sha256'])==64 and
                     isinstance(s.get('bytes'),int) and s['bytes']>500 for s in b['sources'])
          sys.exit(0 if pinned else 1)
          PY
          then
            node tests/environment-727-stage5-source.test.cjs
            python tools/audio/environment-727-treasury-studio.py
          else
            echo 'SOURCE PROBE: unpinned originals: independently report real SHA, bytes and codec, NO MP3 claims'
            python tools/audio/environment-727-treasury-studio.py --probe-sources
          fi
      - name: Retain original source receipts or two physical MP3 previews with decoded QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environmental-stage5-two-treasury-original-source-and-MP3-studies
          path: tools/audio/.environment-727-treasury-preview/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

# Isolated, branch-only SFX study renderer. No game audio registration or deploy.
name: SIBDLP SFX studio candidate quality and branch preview (NO deploy)
on:
  push:
    branches:
      - audio/sfx-modernization-pilot-20261115
    paths:
      - .github/workflows/sfx-pilot-studio.yml
      - tools/audio/sfx-pilot-studio.py
      - tests/audio-sfx-pilot-quality.test.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated-sfx-studies:
    if: github.ref == 'refs/heads/audio/sfx-modernization-pilot-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout exact pilot branch (not main)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned offline renderer dependencies
        run: python -m pip install --disable-pip-version-check --quiet numpy==2.3.5 scipy==1.17.0
      - name: Produce candidate-only WAVs
        run: python tools/audio/sfx-pilot-studio.py tools/audio/sfx-pilot-previews
      - name: Critically check actual waveform and deterministic output
        run: |
          python tests/audio-sfx-pilot-quality.test.py tools/audio/sfx-pilot-previews --verify-rebuild > "${RUNNER_TEMP}/sfx-pilot-quality.json"
          cat "${RUNNER_TEMP}/sfx-pilot-quality.json"
      - name: Block accidental changes to live game audio/manifest
        run: |
          git fetch --no-tags --depth=1 origin main
          if git diff --name-only origin/main HEAD -- assets/audio/ src/prototype/audio-\*.js |
              grep -q .; then
            echo 'This non-shipping pilot must not modify gameplay audio/manifest' >&2
            exit 1
          fi
      - name: Preserve playable preview WAVs only on the dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/audio/sfx-modernization-pilot-20261115'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tools/audio/sfx-pilot-previews/*.wav tools/audio/sfx-pilot-previews/pilot-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'audio: preserve unshipped v2 SFX review WAVs [skip ci]'
            git push origin HEAD:refs/heads/audio/sfx-modernization-pilot-20261115
          else
            echo 'Preview WAVs match checked-in copies.'
          fi
      - name: Preserve QA evidence as an isolated artifact, never Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sibdlp-sfx-v2-quality-evidence
          path: ${{ runner.temp }}/sfx-pilot-quality.json
          if-no-files-found: warn
          retention-days: 30

name: Rogue Integration Format Report
on:
  push:
    branches: [rogue-final-audit-smoke-146]
permissions:
  contents: read
jobs:
  integrated-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23b45b95201059ed457f75063f504d3b89b9e276
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Report exact Prettier changes
        run: |
          npx prettier --write src/prototype/hero-combat.js
          echo 'ROGUE_FORMAT_START'
          git diff --no-ext-diff --unified=3 -- src/prototype/hero-combat.js
          echo 'ROGUE_FORMAT_END'
      - name: Validate package and regressions after formatting
        run: |
          npm run check
          npm test

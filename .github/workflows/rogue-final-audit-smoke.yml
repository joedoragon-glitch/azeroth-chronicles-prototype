name: Rogue Final Audit Probe
on:
  push:
    branches: [rogue-final-audit-smoke-146]
permissions:
  contents: read
jobs:
  focused-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a7053d65bbcf1a13dfe462163afc66f007864458
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify formatting and packaging
        run: |
          npm run format:check
          npm run check
      - name: Verify all focused rogue regression cases
        run: node tests/audit-regressions.test.cjs
      - name: Verify exact sprite scope evidence
        run: node tests/sprite-scope.test.cjs

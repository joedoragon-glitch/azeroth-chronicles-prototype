name: Rogue Integration Audit
on:
  push:
    branches: [rogue-final-audit-smoke-146]
permissions:
  contents: read
jobs:
  integrated-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23b45b95201059ed457f75063f504d3b89b9e276
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Validate formatting and build contracts
        run: |
          npm run format:check
          npm run check
      - name: Run all regression suites
        run: npm test
      - name: Confirm scope and tests
        run: |
          node tests/sprite-scope.test.cjs
          node tests/targeting.test.cjs
          node tests/burst-compression.test.cjs

name: Rogue Final Revision Smoke
on:
  push:
    branches: [rogue-final-audit-smoke-146]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 274a43e238bb6ba6421cc05fd40279accb87c73f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Validate merged rules, packaging and targeting
        run: |
          npm run format:check
          npm run check
          node tests/audit-regressions.test.cjs
          node tests/targeting.test.cjs
          node tests/burst-compression.test.cjs
          node tests/transport-arrivals.test.cjs

name: Rogue Integrated Combat Smoke
on:
  push:
    branches: [rogue-final-audit-smoke-146]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23b45b95201059ed457f75063f504d3b89b9e276
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Run rogue + manual targeting + burst + transport regressions
        run: |
          node tests/audit-regressions.test.cjs
          node tests/targeting.test.cjs
          node tests/burst-compression.test.cjs
          node tests/transport-arrivals.test.cjs
          node tests/sprite-scope.test.cjs
      - name: Capture exact formatting diff
        run: |
          npx prettier --write src/prototype/hero-combat.js
          echo 'ROGUE_FORMAT_START'
          git diff --no-ext-diff --unified=3 -- src/prototype/hero-combat.js
          echo 'ROGUE_FORMAT_END'

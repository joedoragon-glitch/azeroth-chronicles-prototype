name: v0.9.2 tutorial current-main conflict inspector (temporary no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: ['.github/workflows/v092-main-reconciliation-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check current main integration and exact conflicts only
        shell: bash
        run: |
          git fetch --no-tags origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          git config user.name "Integration inspector"
          git config user.email "integration@users.noreply.github.com"
          if git merge --no-commit --no-ff origin/main; then
            echo "CLEAN_MERGE=true"
          else
            echo "CLEAN_MERGE=false"
            git diff --name-only --diff-filter=U | sort
            python3 - <<'PY'
          from pathlib import Path
          for name in ('docs/DEVELOPMENT_STATE.md','docs/evidence/SPRITE_SCOPE_RECONCILIATION.json','sw.js','src/prototype/app.js','src/prototype/visuals.js'):
              p=Path(name)
              if not p.exists(): continue
              t=p.read_text(errors='replace')
              lines=t.splitlines()
              starts=[i for i,line in enumerate(lines) if line.startswith('<<<<<<<')]
              print(f'CONFLICT {name} chunks={len(starts)}')
              for i in starts[:4]:
                  j=next((k for k in range(i+1,len(lines)) if lines[k].startswith('>>>>>>>')),len(lines)-1)
                  segment=lines[max(0,i-3):min(len(lines),j+4)]
                  if name=='sw.js': segment=[x[:180]+' ...(long line)' if len(x)>200 else x for x in segment]
                  print('\\n'.join(segment)[:5500])
          PY
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then git merge --abort; fi

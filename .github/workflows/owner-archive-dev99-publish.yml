name: Owner-authorized dev.99 Keeper Archive copy publication (no tests)
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, 'owner-archive-dev99')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package existing committed files only
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const {core, legacy} = require('./scripts/site-assets.cjs');
          const sprites = require('./src/prototype/sprite-format.js').resources(require('./assets/sprites/manifest.json'));
          if (require('./package.json').version !== '0.9.1+snapshot.dev.99') throw Error('Unexpected publication version');
          fs.mkdirSync('_site', {recursive:true});
          for (const file of new Set([...core, ...legacy, 'sw.js', ...sprites.map(x=>x.src?.replace(/^\.\//,'')).filter(Boolean)])) {
            const dest=path.join('_site',file); fs.mkdirSync(path.dirname(dest),{recursive:true}); fs.copyFileSync(file,dest);
          }
          fs.writeFileSync('_site/build.txt',process.env.GITHUB_SHA+'\n');
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/configure-pages@v5
      - name: Publish authorized snapshot
        id: deployment
        uses: actions/deploy-pages@v5

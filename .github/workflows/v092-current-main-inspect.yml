name: v0.9.2 latest main integration conflict diagnosis (temporary)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: [.github/workflows/v092-current-main-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source-level 3-way merge diagnosis against approved loading fallback
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "PR_HEAD=$(git rev-parse HEAD)"
          echo "MAIN_HEAD=$(git rev-parse origin/main)"
          git config user.name "SIBDLP integration diagnostics"
          git config user.email "integration@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main || true
          echo "CONFLICT_FILES_BEGIN"
          git diff --name-only --diff-filter=U
          echo "CONFLICT_FILES_END"
          python3 - <<'PY'
          import pathlib
          for p in ['src/prototype/app.js','tests/helpers/production-shell.cjs','docs/DEVELOPMENT_STATE.md','docs/evidence/SPRITE_SCOPE_RECONCILIATION.json','sw.js','src/prototype/sprites.js','templates/game.html']:
              path=pathlib.Path(p)
              if not path.exists(): continue
              lines=path.read_text(errors='replace').splitlines()
              at=[i for i,line in enumerate(lines) if line.startswith('<<<<<<<')]
              print(f'FILE={p} HUNKS={len(at)}')
              for k,i in enumerate(at[:6]):
                  e=next((j for j in range(i+1,len(lines)) if lines[j].startswith('>>>>>>>')),i)
                  blob='\\n'.join(lines[max(0,i-4):min(len(lines),e+5)])
                  print(f'CONFLICT {p} #{k+1}: '+blob[:6400])
          PY
          test -z "$(git diff --name-only --diff-filter=U)" && echo "NO_CONFLICTS"
          git merge --abort || true

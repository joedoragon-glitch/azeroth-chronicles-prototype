name: Temporary Sentinel scope reconciliation
on:
  push:
    branches: [content/ash-sentinel-fifth-pillar-244-20261011]
permissions:
  contents: write
jobs:
  scope-snapshot:
    runs-on: ubuntu-latest
    if: github.repository == 'joedoragon-glitch/azeroth-chronicles-prototype'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ash-sentinel-fifth-pillar-244-20261011
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Regenerate actual source-derived sprite scope
        run: |
          node scripts/sprite-scope-audit.cjs > docs/evidence/SPRITE_SCOPE_RECONCILIATION.json
          node tests/sprite-scope.test.cjs
      - name: Commit only reconciled evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/SPRITE_SCOPE_RECONCILIATION.json
          if ! git diff --cached --quiet; then
            git commit -m "test: reconcile sprite scope to Veyra's procedural vanity"
            git push origin HEAD:content/ash-sentinel-fifth-pillar-244-20261011
          fi

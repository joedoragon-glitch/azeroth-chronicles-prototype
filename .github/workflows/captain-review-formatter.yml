name: Temporary captain review formatting
on:
  push:
    branches:
      - captain-individual-overhaul-review
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: captain-individual-overhaul-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/prototype/engine.js src/prototype/combat.js src/prototype/boss-combat.js
      - name: Commit formatting on review branch
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/prototype/engine.js src/prototype/combat.js src/prototype/boss-combat.js
            git commit -m 'Format captain review implementation'
            git push origin HEAD:captain-individual-overhaul-review
          fi

name: Art 321 directional procedural actor audit
# One inert orc facing-east/west scene in the actual paused game. Records
# screenshots; diagnostic only, no renderer/facing/AI/sprite changes.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/visual-review/art321-facing-browser.cjs'
      - '.github/workflows/art321-facing-capture.yml'
permissions:
  contents: read
concurrency:
  group: art321-facing-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  real-webgl-facing-captures:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tooling
        run: npm ci --ignore-scripts
      - name: Capture same fixed enemy looking in two opposite directions
        run: |
          mkdir -p "$RUNNER_TEMP/art321-facing"
          ART321_OUTPUT="$RUNNER_TEMP/art321-facing" node tools/visual-review/art321-facing-browser.cjs
      - name: Retain exact facing PNGs and source pinned JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art321-facing-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/art321-facing/
          if-no-files-found: warn
          retention-days: 14

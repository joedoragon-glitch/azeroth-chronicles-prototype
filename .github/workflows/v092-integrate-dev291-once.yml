name: v0.9.2 integrate latest Canvas recovery main (temporary, no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: [.github/workflows/v092-integrate-dev291-once.yml]
permissions:
  contents: write
concurrency:
  group: v092-dev291-source-reconcile
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge exact current main only into feature branch; preserve both timer contracts
        shell: bash
        env:
          EXPECTED_MAIN: 8af8466ab4080fadceaaba3e38f945d7655a9b30
          BRANCH: feat/v092-tutorial-quest-chain-20261112
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SIBDLP integration CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$EXPECTED_MAIN" || test -f "$(git rev-parse --git-path MERGE_HEAD)"
          actual="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' docs/DEVELOPMENT_STATE.md docs/evidence/SPRITE_SCOPE_RECONCILIATION.json sw.js tests/helpers/production-shell.cjs | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected merge conflicts:"; printf '%s\n' "$actual"; exit 1
          fi
          for file in docs/DEVELOPMENT_STATE.md docs/evidence/SPRITE_SCOPE_RECONCILIATION.json sw.js tests/helpers/production-shell.cjs; do
            git checkout --ours -- "$file"
          done
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const main = process.env.EXPECTED_MAIN;
          const readMain = file => cp.execFileSync('git', ['show', main + ':' + file], {encoding:'utf8'});
          const replaceOnce = (value, oldText, newText, label) => {
            if(!value.includes(oldText)) throw Error('Missing reviewed ' + label);
            return value.replace(oldText, newText);
          };
          const shell = 'tests/helpers/production-shell.cjs';
          let test = fs.readFileSync(shell,'utf8');
          test=replaceOnce(test,
            '    setTimeout() {},\n    clearTimeout() {},\n    setInterval(fn, ms) {\n      options.onInterval?.(fn, ms);\n    },',
            '    setTimeout(fn, ms) {\n      return options.onTimeout?.(fn, ms);\n    },\n    clearTimeout(id) {\n      options.onClearTimeout?.(id);\n    },\n    setInterval(fn, ms) {\n      options.onInterval?.(fn, ms);\n    },',
            'timer mock contract');
          fs.writeFileSync(shell,test);
          const evidence='docs/evidence/SPRITE_SCOPE_RECONCILIATION.json';
          const own=JSON.parse(fs.readFileSync(evidence,'utf8'));
          const theirs=JSON.parse(readMain(evidence));
          const oursKeys=Object.keys(own.sources).sort(), mainKeys=Object.keys(theirs.sources).sort();
          if (JSON.stringify(oursKeys)!==JSON.stringify(mainKeys)) throw Error('Sprite catalog keys changed');
          const changed=oursKeys.filter(k=>own.sources[k]!==theirs.sources[k]);
          if(JSON.stringify(changed)!==JSON.stringify(['src/prototype/renderer.js','src/prototype/sprites.js'])) throw Error('Unexpected source fingerprints '+changed);
          own.sources['src/prototype/sprites.js']=theirs.sources['src/prototype/sprites.js'];
          fs.writeFileSync(evidence,JSON.stringify(own,null,2)+'\n');
          const docPath='docs/DEVELOPMENT_STATE.md';
          let doc=fs.readFileSync(docPath,'utf8');
          doc=replaceOnce(doc,'<!-- CURRENT_BUILD_VERSION: 0.9.1+snapshot.dev.290 -->','<!-- CURRENT_BUILD_VERSION: 0.9.1+snapshot.dev.291 -->','current version marker');
          doc=doc.replace(/^\*\*Current code\/build version:\*\* .+$/m,
            '**Current code/build version:** `0.9.1+snapshot.dev.291` — current main source includes reviewed automatic Canvas failure recovery from #897 and previously published dev.290 audio/shadows; the tutorial adds approved onboarding and menu/localization changes. dev.291 Pages/PWA publication and physical-device adoption are not yet verified. v0.9.2 remains a separate future milestone.');
          doc=doc.replace(/^\| Build\/cache version \|.+$/m,
            '| Build/cache version | **`0.9.1+snapshot.dev.291`** — combined loading and tutorial development source | Rebuild generated source/worker from exact merged content; deployment and installed-device uptake remain separate evidence. |');
          doc='> **16 November 2026 — tutorial candidate reconciled with new dev.291 loading recovery:** Main merged the source-only loading fix #897 without player-facing publication; this PR preserves its automatic Canvas recovery, bounded sprite watchdogs, test-shell timer callbacks, and sprite fingerprints alongside the approved tutorial work. Owner permits merging/publishing this development snapshot after final green integration CI; v0.9.2 completion and actual device acceptance are distinct.\n\n'+doc;
          fs.writeFileSync(docPath,doc);
          NODE
          git add docs/DEVELOPMENT_STATE.md docs/evidence/SPRITE_SCOPE_RECONCILIATION.json tests/helpers/production-shell.cjs
          test -z "$(git diff --name-only --diff-filter=U)"
      - run: npm ci --ignore-scripts
      - name: Regenerate exact integrated offline worker and build metadata
        run: |
          node scripts/build.cjs
          node scripts/build.cjs --check
      - name: Verify tutorial + loading + save + artwork regression contracts
        run: |
          node --check tests/helpers/production-shell.cjs
          node tests/pages-publication-guard.test.cjs
          node tests/sprite-scope.test.cjs
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/platform-runtime.test.cjs
          node tests/persistence-safety.test.cjs
          node tests/sprite-lifecycle.test.cjs
          node tests/scene-transition-lifecycle.test.cjs
          node tests/docs-release-consistency.test.cjs
          node scripts/docs-release-consistency.cjs
      - name: Commit a real two-parent branch-only merge if heads stayed fixed
        shell: bash
        env:
          EXPECTED_MAIN: 8af8466ab4080fadceaaba3e38f945d7655a9b30
          BRANCH: feat/v092-tutorial-quest-chain-20261112
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git diff --cached --check
          git commit -m "merge(tutorial): integrate dev.291 loading recovery and preserve v4/PWA rules [no-pages]"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin "HEAD:refs/heads/$BRANCH"

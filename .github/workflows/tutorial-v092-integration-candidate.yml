name: v0.9.2 tutorial integration candidate (no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tutorial-integration-${{ github.sha }}
  cancel-in-progress: false
jobs:
  tutorial-native:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify staged four-class tutorial, real native milestones and restore
        run: |
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/archive-translation-coverage.test.cjs
      - name: Verify original menu, class, save and presentation regressions
        run: |
          node tests/menus.test.cjs
          node tests/platform-runtime.test.cjs
          node tests/economy.test.cjs
          node tests/sprite-scope.test.cjs
      - name: Source format and offline identity checks
        run: |
          npx prettier --check src/prototype/app.js src/prototype/platform.js styles/phone.css tests/platform-runtime.test.cjs tests/menu-stage4-browser.test.cjs tests/helpers/notice-browser.cjs
          node scripts/build.cjs --check
  tutorial-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor-pixi.cjs --ensure
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Check real browser EN/ES menus, Archive, interaction and navigation
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
          QUEST_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          node tests/menu-stage4-browser.test.cjs
          node tests/quest-archive-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutorial-integration-${{ matrix.engine }}
          path: |
            test-artifacts/menu-stage4/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
  current-main-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry-run current-main integration without changing any branch
        shell: bash
        run: |
          git fetch --no-tags origin main
          echo "Candidate: $(git rev-parse HEAD)"
          echo "Current main: $(git rev-parse origin/main)"
          git config user.name "Candidate integration checker"
          git config user.email "integration-check@users.noreply.github.com"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "PASS: latest main is an ancestor of this tutorial candidate."
            exit 0
          fi
          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::Current main produces a merge conflict; developer reconciliation is required."
            git diff --name-only --diff-filter=U
            git status --short
            git merge --abort
            exit 1
          fi
          echo "Current main merges cleanly into candidate without publishing."
          git merge --abort

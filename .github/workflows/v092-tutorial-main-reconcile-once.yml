name: v0.9.2 tutorial main reconciliation (one-time, no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: ['.github/workflows/v092-tutorial-main-reconcile-once.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: "github.event.head_commit.message == 'ci(v092): reconcile latest main after generated-worker conflict'"
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Merge verified current main and rebuild the only conflicting generated asset
        shell: bash
        env:
          EXPECTED_MAIN: 37ef6b0f86d91e2cc9af92c3660c757855200d33
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "Candidate: $(git rev-parse HEAD)"
          echo "Live main: $(git rev-parse origin/main)"
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_MAIN" ]; then
            echo "::error::Main moved since review; do not integrate a different source tree"
            exit 1
          fi
          git config user.name "Tutorial integration reviewer"
          git config user.email "noreply@users.noreply.github.com"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Current main already included; skipping redundant merge"
            exit 0
          fi
          git merge --no-commit --no-ff origin/main || true
          conflicts=$(git diff --name-only --diff-filter=U | sort)
          if [ "$conflicts" != "sw.js" ]; then
            echo "::error::Unexpected merge conflicts; do not guess at source or design"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          # Never pick either stale source-fingerprint list as release evidence.
          git checkout --ours sw.js
          git add sw.js
          node scripts/build.cjs
          node scripts/build.cjs --check
          node tests/pages-publication-guard.test.cjs
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/platform-runtime.test.cjs
          node tests/shadow-artwork-grounding.test.cjs
          git add -A -- . ':!assets/vendor/pixi-8.22.0.min.js'
          git diff --cached --check
          git status --short
          git commit -m "merge(v092): reconcile dev.290 audio, shadows and offline cache into tutorial draft"
          git push origin HEAD:refs/heads/feat/v092-tutorial-quest-chain-20261112
          echo "Feature candidate integrated: $(git rev-parse HEAD)"

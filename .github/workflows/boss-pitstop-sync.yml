name: Temporary Boss Pitstop Evidence Sync
on:
  push:
    branches: [feature/boss-identity-pitstop-20261011]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Reformat affected gameplay code
        run: npx prettier --write 'src/prototype/*.js' tests/regional-handoffs.test.cjs tests/monster-attack-audit.test.cjs
      - name: Check focused boss and campaign assertions
        run: |
          node tests/boss-identity-pitstop.test.cjs
          node tests/prototype.test.cjs
          node tests/regional-handoffs.test.cjs
      - name: Review and reconcile source snapshot evidence
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const path='tests/fixtures/perf-v09-protected.json';
          const fixture=JSON.parse(fs.readFileSync(path,'utf8'));
          const reviewed=[
            'src/prototype/engine.js','src/prototype/party.js','src/prototype/combat.js',
            'src/prototype/hero-combat.js','src/prototype/boss-combat.js',
            'src/prototype/rules.js','src/prototype/data.js','src/prototype/save.js'
          ];
          for(const file of reviewed){
            if(!(file in fixture.files)) throw Error('Missing protected file '+file);
            fixture.files[file]=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          }
          fixture.reviewedBossPitstop={
            branch:'feature/boss-identity-pitstop-20261011',
            scope:'Approved Mirejaw, Warlord, Drowned Keeper, Ridge Tyrant, Lifebinder and winter estate mechanics and save-compatibility changes. Unchanged app/runtime scheduler hashes remain protected.',
            requires:'Full Node/browser CI, explicit gameplay audit, and separate final author merge approval.'
          };
          fs.writeFileSync(path,JSON.stringify(fixture,null,2)+'\n');
          const output='docs/evidence/SPRITE_SCOPE_RECONCILIATION.json';
          const scope=require('./scripts/sprite-scope-audit.cjs').audit();
          fs.writeFileSync(output,JSON.stringify(scope,null,2)+'\n');
          console.log('Reconciled '+reviewed.length+' reviewed protected sources and refreshed actual sprite scope.');
          NODE
      - name: Commit reviewed formatting/evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prototype tests/fixtures/perf-v09-protected.json docs/evidence/SPRITE_SCOPE_RECONCILIATION.json tests/regional-handoffs.test.cjs tests/monster-attack-audit.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Audit boss changes: refresh protected hashes, sprite scope, formatting'
            git push origin HEAD:feature/boss-identity-pitstop-20261011
          fi

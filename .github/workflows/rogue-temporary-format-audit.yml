name: Temporary rogue PR formatting audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show exact formatter patch without changing repository
        run: |
          npm ci --ignore-scripts
          npx prettier --write src/prototype/rules.js src/prototype/engine.js src/prototype/combat-visuals.js
          echo '===BEGIN_ROGUE_FORMAT_PATCH==='
          git diff --no-ext-diff --unified=3 -- src/prototype/rules.js src/prototype/engine.js src/prototype/combat-visuals.js
          echo '===END_ROGUE_FORMAT_PATCH==='
      - name: Probe focused rogue regressions on formatted working tree
        run: node tests/audit-regressions.test.cjs

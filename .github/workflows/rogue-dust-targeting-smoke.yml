name: Rogue Dust Targeting Smoke
on:
  push:
    branches: [rogue-dust-targeting-smoke]
permissions:
  contents: read
jobs:
  focused-rogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Targeted combat regression scenarios
        run: node tests/audit-regressions.test.cjs
      - name: Validate source formatting
        run: npm run format:check

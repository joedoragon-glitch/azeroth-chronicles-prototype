# Issue #727 Stage 6: ephemeral source-locked integration, never deploy or merge.
name: Environmental Stage 6 isolated A/B game audio (NO deploy)

on:
  push:
    branches:
      - 'audio/environment-727-stage6-*'
    paths:
      - 'tools/audio/environment-727-stage6-lab.cjs'
      - 'tests/environment-727-stage6-*.test.cjs'
      - '.github/workflows/environment-727-stage6-lab.yml'
      - 'docs/AUDIO_ENVIRONMENT.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  integrated-audio:
    name: Frozen previews, disposable PWA and real Chromium WebAudio (NO deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test dependencies and actual decoder
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
      - name: Baseline studio and 19-place original route protection
        run: |
          node tests/environment-727-stage6-source.test.cjs
          node tests/environment-727-stage5-source.test.cjs
          node tests/environment-audio-inventory.test.cjs
      - name: Obtain physically authored frozen MP3s (disposable checkout only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools/audio/.stage6-artifacts
          for id in 13052069308 13053145958 13053643629 13056115086 13055459714; do
            curl --retry 2 --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "/tmp/stage6-$id.zip"
            unzip -o -j -q "/tmp/stage6-$id.zip" '*.mp3' -d tools/audio/.stage6-artifacts
          done
          test "$(find tools/audio/.stage6-artifacts -name '*.mp3' | wc -l)" -eq 16
      - name: Assert exact SHA-256 and format, then create throwaway route overlay
        run: |
          node tools/audio/environment-727-stage6-lab.cjs --materialize
          node scripts/audio-library.cjs check
      - name: Build isolated PWA for browser QA and inspect offline package
        run: |
          node scripts/build.cjs --site
          test -s _site/sw.js
          node -e "const fs=require('fs');const s=fs.readFileSync('sw.js','utf8');for(const id of ['study-vale-day-727.mp3','studio-cindermaw-roost-vault-727.mp3'])if(!s.includes(id))throw Error('Offline asset list missing '+id);console.log('STAGE6_OFFLINE_STATIC: candidate paths appear in generated worker; installation/update remains a separate gate');"
          du -sh _site assets/audio
      - name: Install pinned Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify fresh offline PWA install/reopen and all 16 SHA-verified source files
        run: |
          set -o pipefail
          node tests/environment-727-stage6-offline-browser.test.cjs | tee test-results/environment-727-stage6-offline.log
      - name: Exercise 21 real Campaign scene/night routes with actual decoded candidate MP3s
        run: |
          set -o pipefail
          node tests/environment-727-stage6-browser.test.cjs | tee test-results/environment-727-stage6-browser.log
      - name: Preserve only isolated QA receipts, never a deployable game artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-727-stage6-isolated-audio-QA
          path: |
            test-results/environment-727-stage6-trial.json
            test-results/environment-727-stage6-browser.log
            test-results/environment-727-stage6-offline.log
          if-no-files-found: warn
          retention-days: 14

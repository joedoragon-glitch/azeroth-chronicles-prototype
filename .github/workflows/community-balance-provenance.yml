name: Community balance input provenance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 313
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the original complete observation workflow to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 38879597582 --repo joedoragon-glitch/azeroth-chronicles-prototype --interval 30 --exit-status
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38879597582
          pattern: community-balance-*
          path: test-results/original-balance
      - name: Verify all executable inputs and every original configuration
        run: |
          node scripts/community-balance-provenance.cjs test-results/original-balance test-results/balance-provenance
          echo 'Original 6,912-case study retained; every loaded engine owner, policy, observer and baseline seed is unchanged. No gameplay observation replayed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-balance-input-provenance
          retention-days: 90
          path: test-results/balance-provenance/
          if-no-files-found: error

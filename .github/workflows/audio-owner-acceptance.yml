name: Owner audio defaults and title lifecycle (no deployment)
on:
  pull_request:
    paths:
      - 'src/prototype/audio-*.js'
      - 'src/prototype/app.js'
      - 'tests/audio*.test.cjs'
      - 'docs/AUDIO_PLAYBACK.md'
      - '.github/workflows/audio-owner-acceptance.yml'
permissions:
  contents: read
jobs:
  owner-audio:
    if: startsWith(github.head_ref, 'audio/') || startsWith(github.head_ref, 'fix/title-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify default levels, Greenwood routing and audio mixer regressions
        run: |
          node tests/audio-owner-defaults.test.cjs
          node tests/audio-production.test.cjs
          node tests/audio-stage4-mix-matrix.test.cjs
          node tests/audio-environment.test.cjs
          node tests/audio-recordings.test.cjs
      - name: Prepare full playable scene for Chromium (no deploy)
        run: node scripts/build.cjs
      - run: npx playwright install --with-deps chromium
      - name: Verify real title recording, Return to Main Menu, Continue and Greenwood quiet stem
        run: node tests/audio-phase9-lifecycle-browser.test.cjs

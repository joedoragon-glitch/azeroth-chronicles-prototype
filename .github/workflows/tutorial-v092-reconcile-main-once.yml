name: Tutorial v0.9.2 one-time main reconciliation (no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.event.head_commit.message == 'test(tutorial): prepare guarded main reconciliation'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Guarded merge of verified live main into tutorial branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "Tutorial source $(git rev-parse HEAD)"
          echo "Newest published-source branch $(git rev-parse origin/main)"
          git config user.name "Tutorial integration reviewer"
          git config user.email "noreply@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main || :
          expected=$(git diff --name-only --diff-filter=U | sort)
          required=$(printf 'docs/DEVELOPMENT_STATE.md\nsrc/prototype/app.js\nsw.js')
          if [ "$expected" != "$required" ]; then
            echo "::error::Merge-conflict set differs; refusing automatic merge"
            echo "$expected"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          pattern=re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/main\n',re.S)
          p=Path('src/prototype/app.js'); t=p.read_text()
          m=list(pattern.finditer(t))
          if len(m)!=1 or "n.thornReport" not in t or "storyNavigate(lead, lead.name, null, 'thorn-witness')" not in m[0].group(2):
              raise SystemExit('Unexpected Thorn-witness conflict; refusing merge')
          t=pattern.sub(lambda x:x.group(2),t)
          p.write_text(t)
          p=Path('docs/DEVELOPMENT_STATE.md');t=p.read_text();m=list(pattern.finditer(t))
          if len(m)!=1 or 'menu, character preview and 125% camera' not in m[0].group(1) or 'SFX Phase 1' not in m[0].group(2):
              raise SystemExit('Unexpected development-state conflict; refusing merge')
          t=pattern.sub(lambda x: x.group(2).rstrip()+'\n\n'+x.group(1).lstrip(),t)
          p.write_text(t)
          PY
          # The PWA cache is generated from the complete merged source, including
          # updated sound assets; never select stale fingerprints from either side.
          git checkout --ours sw.js
          git add docs/DEVELOPMENT_STATE.md src/prototype/app.js sw.js
          node scripts/build.cjs
          node scripts/build.cjs --check
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/thorn-witness.test.cjs
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Expected meaningful main integration changes"
            exit 1
          fi
          git commit -m "merge(tutorial): reconcile dev.289 SFX and Thorn witness with v0.9.2 candidate"
          git push origin HEAD:refs/heads/feat/v092-tutorial-quest-chain-20261112
          echo "Integrated tutorial SHA: $(git rev-parse HEAD)"

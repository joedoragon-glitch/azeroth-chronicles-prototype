name: Art 321 earned loot browser lifecycle
# Single disposable Chromium/WebGL2 test of the REAL Campaign.kill -> Crown loot
# -> Campaign.tick pickup path, after independently matched day capture.
# PR-only, no deployment, game-source mutation or browser device matrix.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/visual-review/art321-crown-loot-browser.cjs'
      - '.github/workflows/art321-earned-loot.yml'
permissions:
  contents: read
concurrency:
  group: art321-earned-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  one-earned-coin:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install only locked dependencies
        run: npm ci --ignore-scripts
      - name: Capture real kill, earned-loot display and proximity collection
        run: |
          mkdir -p "$RUNNER_TEMP/art321-earned"
          ART321_EARNED_BROWSER=1 ART321_OUTPUT="$RUNNER_TEMP/art321-earned" node tools/visual-review/art321-crown-loot-browser.cjs
      - name: Retain actual browser PNG and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art321-earned-loot-${{ github.sha }}
          path: ${{ runner.temp }}/art321-earned/
          retention-days: 14
          if-no-files-found: warn

# Bounded #709 master promotion: no Pages publishing or PR auto-merge.
# Input is the four source-verified MP3s made earlier in the isolated studio.
name: Environmental four-track draft integration (NO deploy)

on:
  push:
    branches:
      - 'audit/environment-709-evidence-*'
    paths:
      - 'tools/audio/integrate-regional-candidates.cjs'
      - '.github/workflows/environment-integrate-candidates.yml'
      - 'tests/audio-stage5-release-preflight.test.cjs'
      - 'tests/environment-audio-phaseA3-signal.test.cjs'

permissions:
  contents: write
  actions: read

concurrency:
  group: environmental-master-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-verified-masters:
    name: Preserve originals and install four verified studio MP3s on the draft
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Resolve exact immutable audio studio artifact, not an unreviewed download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-environment"
          gh run download 41207464084 \
            --repo "$GITHUB_REPOSITORY" \
            --name environment-709-four-regional-candidate-previews \
            --dir "$RUNNER_TEMP/verified-environment"
          find "$RUNNER_TEMP/verified-environment" -maxdepth 2 -type f -printf '%f %s bytes\n'
          test "$(find "$RUNNER_TEMP/verified-environment" -type f -name '*.mp3' | wc -l)" -eq 4
      - name: Install project tools and real MP3 decoders
        run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Fail-closed register four SHA256-pinned source masters (preserve 14 original beds)
        run: node tools/audio/integrate-regional-candidates.cjs "$RUNNER_TEMP/verified-environment"
      - name: Regenerate exact browser library and offline hashes
        run: |
          node scripts/build.cjs
          node scripts/build.cjs --check
      - name: Exercise all actual routes, old sound preservation and 18 physical MP3 files
        env:
          REQUIRE_AUDIO_SIGNAL_DECODE: '1'
        run: |
          node tests/environment-audio-inventory.test.cjs
          node tests/audio-production.test.cjs
          node tests/environment-audio-audit.test.cjs
          node tests/environment-audio-phaseA1-runtime.test.cjs
          node tests/environment-audio-phaseA3-signal.test.cjs
          node tests/environment-audio-phaseA4-levels.test.cjs
          node scripts/audio-library.cjs check
      - name: Check change allowlist; no new music, effect files or gameplay edits
        run: |
          git status --short
          if git diff --name-only | grep -E -v '^(assets/audio/manifest.json|src/prototype/audio-library.js|sw.js|tools/audio/environment-regional-studies.json)$'; then
            echo 'Unexpected change to unrelated tracked source; no commit' >&2
            exit 1
          fi
          if git ls-files --others --exclude-standard | grep -E -v '^assets/audio/ambience/(env-highlands-autumn|env-frontier-recovery|env-signal-occupied|env-shrine-occupied)\.mp3$'; then
            echo 'Unapproved new file found; only four pinned audio masters may be added' >&2
            exit 1
          fi
          test "$(git ls-files --others --exclude-standard | wc -l)" -eq 4
      - name: Commit four real MP3s, catalog/routes, ledger and offline PWA hashes to draft only
        run: |
          test "$GITHUB_REF_NAME" = 'audit/environment-709-evidence-20261031'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/ambience/env-highlands-autumn.mp3 \
                  assets/audio/ambience/env-frontier-recovery.mp3 \
                  assets/audio/ambience/env-signal-occupied.mp3 \
                  assets/audio/ambience/env-shrine-occupied.mp3 \
                  assets/audio/manifest.json \
                  src/prototype/audio-library.js \
                  sw.js \
                  tools/audio/environment-regional-studies.json
          git diff --cached --check
          git commit -m 'audio(#709): register four source-proven field-region/occupied-room beds preserving originals'
          git push origin HEAD:"$GITHUB_REF_NAME"
          echo "Draft integration commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

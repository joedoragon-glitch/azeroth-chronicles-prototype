name: Strategist Gate 0 real-renderer evidence
# One branch-scoped visual proof. No Pages deployment or broad browser suites.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/prototype/visuals.js'
      - 'tests/strategist-ogre-visual.test.cjs'
      - 'tools/visual-review/strategist-ogre-gate0/**'
      - '.github/workflows/strategist-gate0-visual.yml'
permissions:
  contents: read
jobs:
  ogre-gate0:
    if: github.head_ref == 'feat/strategist-developer-playtest-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Native procedural art regression
        run: node tests/strategist-ogre-visual.test.cjs
      - name: Native campaign and Canvas renderer captures
        run: node tools/visual-review/strategist-ogre-gate0/capture.cjs
      - name: Upload real capture evidence for creator review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategist-gate0-real-renderer
          path: test-artifacts/strategist-ogre-gate0/
          if-no-files-found: error
          retention-days: 30

name: One-shot candidate formatting (no deployment)
on:
  push:
    branches: [feat/v092-menu-density-camera-portraits-20261116]
    paths:
      - .github/workflows/menu-density-format-one-shot.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only approved candidate code and tests
        run: |
          npx prettier --write src/prototype/platform.js src/prototype/app.js styles/phone.css tests/platform-runtime.test.cjs tests/menu-stage4-browser.test.cjs
          git add src/prototype/platform.js src/prototype/app.js styles/phone.css tests/platform-runtime.test.cjs tests/menu-stage4-browser.test.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(ui): format approved candidate and browser acceptance tests'
            git push origin HEAD:feat/v092-menu-density-camera-portraits-20261116
          fi

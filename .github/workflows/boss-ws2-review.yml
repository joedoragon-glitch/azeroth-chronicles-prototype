name: Temporary WS2 estate verification
on:
  push:
    branches: [feature/boss-identity-pitstop-20261011]
permissions:
  contents: write
jobs:
  ws2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Format WS2 and persist
        run: |
          npx prettier --write scripts/perf-ws2-renderer-performance.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/perf-ws2-renderer-performance.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format reviewed winter-estate performance comparison'
            git push origin HEAD:feature/boss-identity-pitstop-20261011
          fi
      - name: Targeted Chromium estate negative-control and stability benchmark
        run: |
          git fetch --depth=1 origin c6ce1af236bddd7ca881903499c4cf5de175f9e2
          mkdir -p "$RUNNER_TEMP/perf-v09-baseline"
          git archive c6ce1af236bddd7ca881903499c4cf5de175f9e2 | tar -x -C "$RUNNER_TEMP/perf-v09-baseline"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          CHROMIUM_EXECUTABLE="$CHROME" PERF_WS2_BROWSER_ENGINE=chromium PERF_WS2_SCENE_FILTER='crypt-' PERF_WS2_RENDER_ROUNDS=2 PERF_WS2_RENDER_WARMUP=3 PERF_WS2_BASELINE_ROOT="$RUNNER_TEMP/perf-v09-baseline" node scripts/perf-ws2-renderer-performance.cjs test-results/perf/ws2-crypt-review.json

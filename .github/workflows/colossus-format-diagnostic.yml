name: Temporary Colossus format diagnostic
on:
  pull_request:
    paths:
      - 'src/prototype/rules.js'
      - 'src/prototype/data.js'
      - '.github/workflows/colossus-format-diagnostic.yml'
jobs:
  print-prettier-diff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Print exact Prettier changes without modifying repository
        run: |
          npx --no-install prettier --write src/prototype/rules.js src/prototype/data.js
          git --no-pager diff -- src/prototype/rules.js src/prototype/data.js

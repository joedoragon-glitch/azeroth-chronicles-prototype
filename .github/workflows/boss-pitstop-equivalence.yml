name: Temporary boss pitstop baseline check
on:
  push:
    branches: [feature/boss-identity-pitstop-20261011]
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Compare unaffected simulation and reviewed estate
        run: |
          git fetch --depth=1 origin c6ce1af236bddd7ca881903499c4cf5de175f9e2
          mkdir -p "$RUNNER_TEMP/pitstop-baseline"
          git archive c6ce1af236bddd7ca881903499c4cf5de175f9e2 | tar -x -C "$RUNNER_TEMP/pitstop-baseline"
          node --expose-gc scripts/perf-v09-equivalence.cjs "$RUNNER_TEMP/pitstop-baseline"
      - name: Format reviewed code and refresh protected hashes
        run: |
          npx prettier --write 'src/prototype/*.js' scripts/perf-v09-equivalence.cjs tests/boss-identity-pitstop.test.cjs
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const path='tests/fixtures/perf-v09-protected.json',x=JSON.parse(fs.readFileSync(path,'utf8'));
          for(const file of [
            'src/prototype/engine.js','src/prototype/party.js','src/prototype/combat.js',
            'src/prototype/hero-combat.js','src/prototype/boss-combat.js',
            'src/prototype/rules.js','src/prototype/data.js','src/prototype/save.js'
          ]) x.files[file]=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          fs.writeFileSync(path,JSON.stringify(x,null,2)+'\n');
          NODE
      - name: Commit reviewed formatting and verified hashes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/prototype tests/fixtures/perf-v09-protected.json scripts/perf-v09-equivalence.cjs tests/boss-identity-pitstop.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Format and protect reviewed boss redesign and baseline exception'
            git push origin HEAD:feature/boss-identity-pitstop-20261011
          fi

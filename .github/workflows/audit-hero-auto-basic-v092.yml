name: v0.9.2 hero auto-basic cadence audit (no deployment)

on:
  push:
    branches:
      - audit/v092-hero-auto-cadence-20261116

permissions:
  contents: read

jobs:
  native-audit:
    name: Four-class combat-engine timing and target-lock measurement
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check tests/audit-hero-auto-basic-cadence-v092.test.cjs
      - name: Run native timing, Slow and targeting measurements
        run: node tests/audit-hero-auto-basic-cadence-v092.test.cjs

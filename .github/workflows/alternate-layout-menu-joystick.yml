name: Developer alternate layout menu joystick regression (no deployment)

on:
  pull_request:
    branches: [developer/alternate-control-layout]
    paths:
      - 'src/prototype/app.js'
      - 'src/prototype/input.js'
      - 'sw.js'
      - 'tests/alternate-layout-menu-joystick.test.cjs'
      - 'tests/developer-alternate-layout-save.test.cjs'
      - '.github/workflows/alternate-layout-menu-joystick.yml'
  push:
    branches: [developer/alternate-control-layout]

permissions:
  contents: read

jobs:
  precise-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/prototype/input.js
          node --check src/prototype/app.js
          node --check tests/alternate-layout-menu-joystick.test.cjs
          node --check tests/developer-alternate-layout-save.test.cjs
          node --check sw.js
      - name: Menu input and unchanged field controls
        run: node tests/alternate-layout-menu-joystick.test.cjs
      - name: New run/save/relaunch/continue is isolated from public storage
        run: node tests/developer-alternate-layout-save.test.cjs
      - name: Offline worker fingerprints match committed controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const worker = fs.readFileSync('sw.js', 'utf8');
          for (const path of ['src/prototype/app.js', 'src/prototype/input.js']) {
            const bytes = fs.readFileSync(path);
            const hash = crypto.createHash('sha1')
              .update('blob ' + bytes.length + String.fromCharCode(0)).update(bytes).digest('hex');
            const entry = JSON.stringify('./' + path) + ':' + JSON.stringify(hash);
            if (!worker.includes(entry)) throw Error('Stale offline worker fingerprint: ' + path);
          }
          console.log('PASS alternate-layout worker fingerprints are source-exact');
          NODE

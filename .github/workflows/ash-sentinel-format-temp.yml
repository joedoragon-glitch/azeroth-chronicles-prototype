name: Temporary Sentinel formatter
on:
  push:
    branches: [content/ash-sentinel-fifth-pillar-244-20261011]
permissions:
  contents: write
jobs:
  format-sentinel:
    runs-on: ubuntu-latest
    if: github.repository == 'joedoragon-glitch/azeroth-chronicles-prototype'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/ash-sentinel-fifth-pillar-244-20261011
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only the authorized combat changes
        run: npx prettier --write src/prototype/boss-combat.js src/prototype/combat-visuals.js src/prototype/combat.js src/prototype/engine.js src/prototype/narration.js
      - name: Commit formatting to this draft branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/prototype/boss-combat.js src/prototype/combat-visuals.js src/prototype/combat.js src/prototype/engine.js src/prototype/narration.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format isolated Ash Sentinel combat"
            git push origin HEAD:content/ash-sentinel-fifth-pillar-244-20261011
          fi

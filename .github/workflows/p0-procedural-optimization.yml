name: P0 bounded procedural image acceptance (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/pixi-procedural-bounds-browser.test.cjs'
      - '.github/workflows/p0-procedural-optimization.yml'
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium --with-deps
      - run: node tests/pixi-procedural-bounds-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-procedural-image-evidence
          path: test-results/pixi-procedural-bounds.json

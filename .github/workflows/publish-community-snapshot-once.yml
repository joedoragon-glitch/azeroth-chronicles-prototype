name: Publish Skill 1 correction once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-community-snapshot-once.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.event.before == 'ee25e05ee9066d23c92b8ca729849d64cc7e14b8' && github.event.head_commit.message == 'Publish Skill 1 retreat correction without further CI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SNAPSHOT_SHA: ee25e05ee9066d23c92b8ca729849d64cc7e14b8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee25e05ee9066d23c92b8ca729849d64cc7e14b8
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package the owner-authorized correction
        run: GITHUB_SHA="$SNAPSHOT_SHA" node scripts/build.cjs --check --site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish correction
        id: deployment
        uses: actions/deploy-pages@v5

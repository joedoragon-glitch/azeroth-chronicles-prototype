name: v0.9.2 auto-basic updated-main integration (no deployment)

on:
  push:
    branches:
      - fix/v092-hero-auto-basic-fallback-main-sync-20261116

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check src/prototype/hero-combat.js
          node --check tests/v092-hero-auto-basic-target-fallback.test.cjs
      - name: Four-class target, skill and Slow regression
        run: |
          node tests/v092-hero-auto-basic-target-fallback.test.cjs
          node tests/hero-skill1-stage1.test.cjs
          node tests/rogue-hero-phase2.test.cjs
          node tests/slow-cooldown.test.cjs
          node tests/hero-skill1-integration.test.cjs
      - name: Format new regression, build and verify generated assets
        run: |
          npm ci --ignore-scripts
          npx prettier --check tests/v092-hero-auto-basic-target-fallback.test.cjs
          node scripts/build.cjs
          node scripts/build.cjs --check
          git diff --check
      - name: Commit exact updated-main worker fingerprint (branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          test -z "$(git diff --name-only)"
          if ! git diff --cached --quiet; then
            git commit -m "build(combat): regenerate updated-main PWA fingerprint [skip ci]"
            git push origin HEAD:refs/heads/fix/v092-hero-auto-basic-fallback-main-sync-20261116
          fi

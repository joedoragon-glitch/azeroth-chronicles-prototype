name: v0.9.2 tutorial diagnostics control (no deployment)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
permissions:
  contents: read
jobs:
  conflict-detail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print exact current-main conflict hunks for scoped reconciliation
        shell: bash
        run: |
          git fetch --no-tags origin main
          git config user.name "Merge conflict inspector"
          git config user.email "noreply@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/prototype/app.js','docs/DEVELOPMENT_STATE.md','sw.js'):
              text=Path(name).read_text()
              blocks=[]
              lines=text.splitlines()
              i=0
              while i<len(lines):
                  if lines[i].startswith('<<<<<<<'):
                      start=i
                      while i<len(lines) and not lines[i].startswith('>>>>>>>'):i+=1
                      blocks.append((start+1,'\n'.join(lines[max(0,start-5):min(len(lines),i+6)])))
                  i+=1
              print(f"### {name}: {len(blocks)} conflict chunks")
              for line,block in blocks:
                  print(f"--- at line {line}, begin ---")
                  print(block[:12000])
                  print("--- end ---")
          PY
  main-archive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor-pixi.cjs --ensure
      - run: npx playwright install --with-deps chromium
      - name: Verify whether current main also fails the Chronicle notice resume
        env:
          QUEST_BROWSER_ENGINE: chromium
        run: node tests/quest-archive-browser.test.cjs

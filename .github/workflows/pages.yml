name: Full game and WebKit certification (manual only)
# Owner approval is required before running expensive, game-wide CI.
# Normal PRs and pushes use focused-deploy.yml instead.
on:
  workflow_dispatch:
    inputs:
      approve_full_suite:
        description: 'I authorize the complete game, Chromium and WebKit test suites'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-plan:
    if: ${{ inputs.approve_full_suite == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse || 'false' }}
      run_id: ${{ steps.reuse.outputs.run_id }}
      # One-time owner-approved FPS-settings publication; focused tests only.
      # This shortcut expires after the exact parent commit below is pushed.
      hotkey_fast: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '43d26166f64153d49c911ccc191167e8245bf5f8' }}
      # OWNER-AUTHORIZED ONE-TIME experimental playtest publication.
      # Only the first push from the exact current main parent is eligible;
      # later pushes always use the normal full validation gates.
      pixi_playtest: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '869049797d5e29270886871c89068f648c1f2a6c' && contains(github.event.head_commit.message, 'Release experimental PixiJS playtest') }}
      # One-time owner-approved report-only update; normal full gates resume
      # on all later commits.
      renderer_report_fast: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '0ec9a0821d3322405ea1616400b306c3a2478f54' && contains(github.event.head_commit.message, 'Release renderer status in playtest reports') }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          node-version: '22'
      - name: Look for successful full validation of this exact tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/reuse-validation.cjs
      - name: Keep full validation for PRs and manual runs
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: echo 'Full validation required unless the PR qualifies for prose-only checks.'

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.full.outcome == 'success' && steps.scope.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Determine check scope
        id: scope
        run: node .github/scripts/check-scope.cjs
      - name: Validate prose-only update
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node tests/architecture.test.cjs
          node tests/ci-scope.test.cjs
      - name: Run full game checks
        id: full
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/check-game
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: hero-skills-chromium
          retention-days: 3
          path: test-results/hero-skills-chromium/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: pr-smoke-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  phone-webkit:
    needs: release-plan
    if: inputs.approve_full_suite == true
    runs-on: ubuntu-latest
    outputs:
      full_validation: ${{ steps.full.outputs.validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reuse successful full browser validation
        if: needs.release-plan.outputs.reuse == 'true'
        env:
          VALIDATED_RUN: ${{ needs.release-plan.outputs.run_id }}
        run: echo "Exact tree already passed full checks in run $VALIDATED_RUN."
      - name: Determine check scope
        id: scope
        run: node .github/scripts/check-scope.cjs
      - name: Validate prose-only update
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node tests/architecture.test.cjs
          node tests/ci-scope.test.cjs
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        run: npm ci --ignore-scripts
      - name: Prepare pinned local PixiJS for offline-capable PWA browser tests
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        run: node scripts/vendor-pixi.cjs --ensure
      - name: Install WebKit and browser dependencies
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        timeout-minutes: 5
        run: |
          # Avoid slow Azure mirror downloads on fresh hosted runners; packages and signatures stay identical.
          for aptSource in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$aptSource" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$aptSource"
            fi
          done
          npx playwright install --with-deps webkit
      - name: Verify WebKit phone presentation and gestures
        id: webkit_phone
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        run: node tests/phone-webkit-browser.test.cjs
      - name: Verify optional PixiJS WebGL2 fallback in WebKit
        id: webkit_pixi
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          BROWSER_ENGINE: webkit
        run: node tests/pixi-renderer-browser.test.cjs
      - name: Verify WebKit cooldown charge queues and save upgrade
        id: webkit_saves
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          BROWSER_ENGINE: webkit
        run: |
          node tests/frame-rate-browser.test.cjs
          node tests/cooldown-input-browser.test.cjs
          git fetch --depth=1 origin 01238bddc8dde4dafe99ba50148d944141373f49
          mkdir -p "$RUNNER_TEMP/cooldown-v118"
          git archive 01238bddc8dde4dafe99ba50148d944141373f49 | tar -x -C "$RUNNER_TEMP/cooldown-v118"
          COOLDOWN_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" node tests/cooldown-pwa-upgrade-browser.test.cjs
          mkdir -p test-results/beta-historical
          BETA_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" BETA_FIXTURE_DIR=test-results/beta-historical node scripts/beta-history-audit.cjs > test-results/beta-history-report.json
          BETA_FIXTURE_DIR=test-results/beta-historical node tests/beta-campaign-browser.test.cjs
      - name: Verify WebKit quest completion and Keeper Archive
        id: webkit_archive
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          QUEST_BROWSER_ENGINE: webkit
        run: |
          node tests/quest-archive-browser.test.cjs
          node tests/archive-a5-browser.test.cjs
      - name: Verify Community Snapshot pets and native procedural scenes in WebKit
        id: webkit_community
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          BROWSER_ENGINE: webkit
        run: |
          node tests/personalization-browser.test.cjs
          node tests/community-snapshot-browser.test.cjs
      - name: Audit integrated rogue warnings and effects in WebKit
        id: webkit_rogue
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          ROGUE_BROWSER_ENGINE: webkit
        run: node tests/rogue-browser.test.cjs
      - name: Verify WebKit audio playback and lifecycle
        id: webkit_audio
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          AUDIO_BROWSER_ENGINE: webkit
          BROWSER_ENGINE: webkit
        run: |
          hero_av_status=0
          node tests/hero-skills-browser.test.cjs || hero_av_status=1
          node tests/audio-browser.test.cjs || hero_av_status=1
          node tests/audio-audition-browser.test.cjs || hero_av_status=1
          exit "$hero_av_status"
      - name: Verify WebKit enemy VFX catalog and pilot captures
        id: webkit_vfx
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          VFX_BROWSER_ENGINE: webkit
        run: |
          node tests/enemy-vfx-browser.test.cjs
          VFX_CAPTURE_TAG=webkit-ci VFX_CAPTURE_SMOKE=1 VFX_CAPTURE_VISUAL_ONLY=1 node scripts/enemy-vfx-capture.cjs
      - name: Verify WebKit original-master actor idles and combat
        id: webkit_sprites
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        run: |
          node scripts/sprite-production-browser-review.cjs local test-results/sprite-pilot-webkit webkit
          node scripts/sprite-nature-browser-review.cjs local test-results/sprite-nature-webkit webkit
      - name: Verify WebKit terrain material rendering
        id: webkit_terrain
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          MATERIAL_BROWSER_ENGINE: webkit
        run: |
          node tests/materials-browser.test.cjs
          node tests/ground-cache-browser.test.cjs
      - name: Verify WebKit performance changes when present
        id: webkit_perf
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true' && hashFiles('tests/perf-v09-protected.test.cjs') != ''
        env:
          MATERIAL_BROWSER_ENGINE: webkit
          PERF_WS2_BROWSER_ENGINE: webkit
        run: |
          git fetch --depth=1 origin c6ce1af236bddd7ca881903499c4cf5de175f9e2
          mkdir -p "$RUNNER_TEMP/perf-v09-baseline"
          git archive c6ce1af236bddd7ca881903499c4cf5de175f9e2 | tar -x -C "$RUNNER_TEMP/perf-v09-baseline"
          node tests/perf-ws1-roads-browser.test.cjs
          node tests/perf-ws2-occlusion-browser.test.cjs
          PERF_WS2_BASELINE_ROOT="$RUNNER_TEMP/perf-v09-baseline" node scripts/perf-ws2-renderer-performance.cjs test-results/perf/combined-webkit.json
      - name: Capture native snapshot phone and desktop visual audit
        id: webkit_visuals
        continue-on-error: true
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          SNAPSHOT_VISUAL_ENGINE: webkit
        run: node scripts/snapshot-certification-visuals.cjs
      - name: Record completed full WebKit validation
        id: full
        if: steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        env:
          WEBKIT_CHECK_STATES: ${{ toJSON(steps) }}
        run: |
          node <<'NODE'
          const states = JSON.parse(process.env.WEBKIT_CHECK_STATES || '{}');
          const required = ['webkit_phone', 'webkit_pixi', 'webkit_saves', 'webkit_archive', 'webkit_rogue', 'webkit_audio', 'webkit_vfx', 'webkit_sprites', 'webkit_terrain', 'webkit_visuals', 'webkit_community'];
          const failed = Object.entries(states).filter(([, value]) => value.outcome === 'failure').map(([name]) => name);
          for (const name of required) if (states[name]?.outcome !== 'success' && !failed.includes(name)) failed.push(name);
          if (failed.length) { console.error('WebKit certification blocked by: ' + failed.join(', ')); process.exit(1); }
          NODE
          echo 'validated=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        with:
          name: hero-skills-webkit
          retention-days: 3
          path: test-results/hero-skills-webkit/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true' && needs.release-plan.outputs.reuse != 'true'
        with:
          name: webkit-phone-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  # Draft PR #300 only: obtain a reproducible formatter correction while
  # independently preserving the strict pr-check/release certificate gate.
  snapshot-format-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 300
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked formatter
        run: npm ci --ignore-scripts
      - name: Generate formatting-only patch for audit
        shell: bash
        run: |
          npm run format
          mkdir -p test-results/snapshot-format
          git diff --no-ext-diff --unified=3 > test-results/snapshot-format/prettier.patch
          git diff --name-only > test-results/snapshot-format/changed-files.txt
          git diff --stat
          echo '<<<SNAPSHOT_PRETTIER_PATCH_START>>>'
          cat test-results/snapshot-format/prettier.patch
          echo '<<<SNAPSHOT_PRETTIER_PATCH_END>>>'
      - name: Record current sprite-scope evidence for the final audit
        shell: bash
        run: |
          node scripts/sprite-scope-audit.cjs > test-results/snapshot-format/sprite-scope.json
          echo '<<<SNAPSHOT_SPRITE_SCOPE_START>>>'
          cat test-results/snapshot-format/sprite-scope.json
          echo '<<<SNAPSHOT_SPRITE_SCOPE_END>>>'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-format-patch
          retention-days: 7
          path: test-results/snapshot-format/
          if-no-files-found: warn

  certify-pr:
    if: github.event_name == 'pull_request' && needs.pr-check.outputs.full_validation == 'true' && needs.phone-webkit.outputs.full_validation == 'true'
    needs: [pr-check, phone-webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clean checkout can produce the release package
        run: node scripts/build.cjs --check --site
      - name: Certify the exact fully tested tree
        id: certificate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const git = (ref) => cp.execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          const tree = git('HEAD^{tree}');
          const certificate = { version: 1, tree, commit: git('HEAD'), run_id: Number(process.env.GITHUB_RUN_ID), full: true };
          fs.writeFileSync(process.env.RUNNER_TEMP + '/certificate.json', JSON.stringify(certificate));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tree=' + tree + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: validated-tree-${{ steps.certificate.outputs.tree }}
          path: ${{ runner.temp }}/certificate.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  main-test:
    if: inputs.approve_full_suite == true && github.event_name == 'workflow_dispatch'
    needs: release-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.release-plan.outputs.reuse == 'true' || needs.release-plan.outputs.pixi_playtest == 'true' || needs.release-plan.outputs.renderer_report_fast == 'true'
        with:
          node-version: '22'
      - name: Reuse successful full regression validation
        if: needs.release-plan.outputs.reuse == 'true'
        env:
          VALIDATED_RUN: ${{ needs.release-plan.outputs.run_id }}
        run: echo "Exact tree already passed full checks in run $VALIDATED_RUN; rebuilding the release package."
      - name: Run full game checks
        if: needs.release-plan.outputs.reuse != 'true' && needs.release-plan.outputs.hotkey_fast != 'true' && needs.release-plan.outputs.pixi_playtest != 'true' && needs.release-plan.outputs.renderer_report_fast != 'true'
        uses: ./.github/actions/check-game
      - name: Verify renderer report and package (one-time owner approval)
        if: needs.release-plan.outputs.renderer_report_fast == 'true'
        run: |
          node --check src/prototype/app.js
          node -e 'const s=require("fs").readFileSync("src/prototype/app.js","utf8");if(!s.includes("graphicsRenderer: {")||!s.includes("activeRenderer:"))process.exit(1)'
          node scripts/build.cjs --check --site
      - name: Run focused experimental PixiJS playtest checks (one-time owner authorization)
        if: needs.release-plan.outputs.pixi_playtest == 'true'
        run: |
          npm ci --ignore-scripts
          node scripts/build.cjs --check --site
          node tools/webgl-pilot/renderer-switch-guard.test.cjs
          node tests/pixi-step2-contract.test.cjs
          node tests/pixi-step3-source.test.cjs
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            export CHROMIUM_EXECUTABLE="$CHROME"
          else
            npx playwright install chromium
          fi
          node tests/pixi-renderer-browser.test.cjs
      - name: Run focused FPS controller and settings checks only
        if: needs.release-plan.outputs.hotkey_fast == 'true'
        run: |
          node tests/frame-rate.test.cjs
          node tests/frame-skip.test.cjs
          node tests/game-menu-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always() && needs.release-plan.outputs.reuse != 'true' && needs.release-plan.outputs.hotkey_fast != 'true' && needs.release-plan.outputs.pixi_playtest != 'true' && needs.release-plan.outputs.renderer_report_fast != 'true'
        with:
          name: app-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare app files
        run: node scripts/build.cjs --check --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: >-
      ${{ always() && inputs.approve_full_suite == true && github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' && needs.main-test.result == 'success' &&
          (needs.phone-webkit.result == 'success' ||
           ((needs.release-plan.outputs.hotkey_fast == 'true' || needs.release-plan.outputs.pixi_playtest == 'true' || needs.release-plan.outputs.renderer_report_fast == 'true') && needs.phone-webkit.result == 'skipped')) }}
    needs: [release-plan, main-test, phone-webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        if: needs.release-plan.outputs.hotkey_fast != 'true'
        run: npm ci --ignore-scripts
      - name: Use runner Chrome for live smoke verification
        if: needs.release-plan.outputs.hotkey_fast != 'true'
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Wait for the exact published build
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..30}; do
            PUBLISHED="$(curl -fsSL -H 'Cache-Control: no-cache' "${PLAYTEST_URL}build.txt?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [ "${PUBLISHED}" = "${GITHUB_SHA}" ]; then
              echo "Published build matches commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (${attempt}/30)…"
            sleep 4
          done
          echo "Published site did not reach commit ${GITHUB_SHA} in time."
          exit 1
      - name: Verify published desktop and phone smoke paths
        if: needs.release-plan.outputs.hotkey_fast != 'true' && needs.release-plan.outputs.pixi_playtest != 'true' && needs.release-plan.outputs.renderer_report_fast != 'true'
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_SMOKE: '1'
        run: node tests/prototype-browser.test.cjs
      - name: Verify published original-master actor idles and roads
        if: needs.release-plan.outputs.hotkey_fast != 'true' && needs.release-plan.outputs.pixi_playtest != 'true' && needs.release-plan.outputs.renderer_report_fast != 'true'
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/sprite-production-browser-review.cjs "$PLAYTEST_URL" test-results/sprite-pilot-live chromium
          node scripts/sprite-nature-browser-review.cjs "$PLAYTEST_URL" test-results/sprite-nature-live chromium
      - name: Verify published quest completion and Keeper Archive
        if: needs.release-plan.outputs.hotkey_fast != 'true' && needs.release-plan.outputs.pixi_playtest != 'true' && needs.release-plan.outputs.renderer_report_fast != 'true'
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/quest-archive-browser.test.cjs
      - name: Verify published experimental PixiJS selector and fallback
        if: needs.release-plan.outputs.pixi_playtest == 'true'
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/pixi-renderer-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-app-screenshots
          path: test-results/
          if-no-files-found: ignore

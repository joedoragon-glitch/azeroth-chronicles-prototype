name: Test and deploy app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Check generated entries and all published JavaScript
        run: npm run check
      - name: Full regression suite before merge
        run: npm test
      - name: Use runner Chrome for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test desktop and full phone matrix before merge
        run: node tests/prototype-browser.test.cjs
      - name: Verify audio playback and lifecycle
        run: |
          node tests/audio-browser.test.cjs
          node tests/audio-audition-browser.test.cjs
      - name: Verify terrain material rendering
        run: node tests/materials-browser.test.cjs
      - name: Verify development sprite showroom
        run: node tests/sprite-showroom-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-smoke-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  phone-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit and browser dependencies
        timeout-minutes: 5
        run: |
          # Avoid slow Azure mirror downloads on fresh hosted runners; packages and signatures stay identical.
          for aptSource in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$aptSource" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$aptSource"
            fi
          done
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps webkit
      - name: Verify WebKit phone presentation and gestures
        run: node tests/phone-webkit-browser.test.cjs
      - name: Verify WebKit audio playback and lifecycle
        env:
          AUDIO_BROWSER_ENGINE: webkit
        run: |
          node tests/audio-browser.test.cjs
          node tests/audio-audition-browser.test.cjs
      - name: Verify WebKit terrain material rendering
        env:
          MATERIAL_BROWSER_ENGINE: webkit
        run: node tests/materials-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-phone-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  main-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Check generated entries and all published JavaScript
        run: npm run check
      - name: Full regression suite
        run: npm test
      - name: Use runner Chrome for full browser matrix
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test full desktop and mobile matrix
        run: node tests/prototype-browser.test.cjs
      - name: Verify audio playback and lifecycle
        run: |
          node tests/audio-browser.test.cjs
          node tests/audio-audition-browser.test.cjs
      - name: Verify terrain material rendering
        run: node tests/materials-browser.test.cjs
      - name: Verify development sprite showroom
        run: node tests/sprite-showroom-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare app files
        run: node scripts/build.cjs --check --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [main-test, phone-webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use runner Chrome for live smoke verification
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Wait for the exact published build
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..30}; do
            PUBLISHED="$(curl -fsSL -H 'Cache-Control: no-cache' "${PLAYTEST_URL}build.txt?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [ "${PUBLISHED}" = "${GITHUB_SHA}" ]; then
              echo "Published build matches commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (${attempt}/30)…"
            sleep 4
          done
          echo "Published site did not reach commit ${GITHUB_SHA} in time."
          exit 1
      - name: Verify published desktop and phone smoke paths
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_SMOKE: '1'
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-app-screenshots
          path: test-results/
          if-no-files-found: ignore

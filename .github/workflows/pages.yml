name: Test and deploy app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - run: npm run release
      - name: Test desktop and mobile app in Chromium
        run: node tests/prototype-browser.test.cjs
      - name: Test portable release in Chromium
        env:
          PLAYTEST_FILE: release/Azeroth_Chronicles_Playtest.html
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare app files
        run: |
          mkdir _site
          cp index.html rts.html manifest.webmanifest sw.js _site/
          cp legacy.html prototype.html _site/
          cp -R styles src icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install live verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Wait for the exact published build
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EXPECTED="version:'$(node -p "require('./package.json').version")-prototype'"
          for attempt in {1..30}; do
            if curl -fsSL -H 'Cache-Control: no-cache' "${PLAYTEST_URL}src/prototype/app.js?sha=${GITHUB_SHA}&attempt=${attempt}" | grep -Fq "${EXPECTED}"; then
              echo "Published build matches ${EXPECTED}"
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (${attempt}/30)…"
            sleep 5
          done
          echo "Published site did not reach the expected build in time."
          exit 1
      - name: Verify published adventure in clean browsers
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/prototype-browser.test.cjs
      - name: Test portable release in Chromium
        env:
          PLAYTEST_FILE: release/Azeroth_Chronicles_Playtest.html
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-app-screenshots
          path: test-results/
          if-no-files-found: ignore

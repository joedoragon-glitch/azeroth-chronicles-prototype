name: Test and deploy app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fast gameplay, save and UI regressions
        run: npm run test:quick
      - name: Use runner Chrome for browser smoke tests
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Smoke test desktop and phone
        env:
          BROWSER_SMOKE: '1'
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-smoke-screenshots
          path: test-results/
          if-no-files-found: ignore

  main-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression suite
        run: npm test
      - name: Use runner Chrome for full browser matrix
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Test full desktop and mobile matrix
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare app files
        run: |
          mkdir _site
          cp index.html rts.html manifest.webmanifest sw.js _site/
          cp legacy.html prototype.html _site/
          cp -R styles src icons assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: main-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use runner Chrome for live smoke verification
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Wait for the exact published build
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          EXPECTED="version:'$(node -p "require('./package.json').version")-prototype'"
          for attempt in {1..20}; do
            if curl -fsSL -H 'Cache-Control: no-cache' "${PLAYTEST_URL}src/prototype/app.js?sha=${GITHUB_SHA}&attempt=${attempt}" | grep -Fq "${EXPECTED}"; then
              echo "Published build matches ${EXPECTED}"
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (${attempt}/20)…"
            sleep 4
          done
          echo "Published site did not reach the expected build in time."
          exit 1
      - name: Verify published desktop and phone smoke paths
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_SMOKE: '1'
        run: node tests/prototype-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-app-screenshots
          path: test-results/
          if-no-files-found: ignore

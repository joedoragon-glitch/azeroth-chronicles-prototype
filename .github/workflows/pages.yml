name: Test and deploy app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine check scope
        id: scope
        run: node .github/scripts/check-scope.cjs
      - name: Validate prose-only update
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node tests/architecture.test.cjs
          node tests/ci-scope.test.cjs
      - name: Run full game checks
        if: steps.scope.outputs.docs_only != 'true'
        uses: ./.github/actions/check-game
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: pr-smoke-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  phone-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine check scope
        id: scope
        run: node .github/scripts/check-scope.cjs
      - name: Validate prose-only update
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          node tests/architecture.test.cjs
          node tests/ci-scope.test.cjs
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci --ignore-scripts
      - name: Install WebKit and browser dependencies
        if: steps.scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          # Avoid slow Azure mirror downloads on fresh hosted runners; packages and signatures stay identical.
          for aptSource in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$aptSource" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$aptSource"
            fi
          done
          npx playwright install --with-deps webkit
      - name: Verify WebKit phone presentation and gestures
        if: steps.scope.outputs.docs_only != 'true'
        run: node tests/phone-webkit-browser.test.cjs
      - name: Verify WebKit cooldown charge queues and save upgrade
        if: steps.scope.outputs.docs_only != 'true'
        env:
          BROWSER_ENGINE: webkit
        run: |
          node tests/cooldown-input-browser.test.cjs
          git fetch --depth=1 origin 01238bddc8dde4dafe99ba50148d944141373f49
          mkdir -p "$RUNNER_TEMP/cooldown-v118"
          git archive 01238bddc8dde4dafe99ba50148d944141373f49 | tar -x -C "$RUNNER_TEMP/cooldown-v118"
          COOLDOWN_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" node tests/cooldown-pwa-upgrade-browser.test.cjs
          mkdir -p test-results/beta-historical
          BETA_PREVIOUS_ROOT="$RUNNER_TEMP/cooldown-v118" BETA_FIXTURE_DIR=test-results/beta-historical node scripts/beta-history-audit.cjs > test-results/beta-history-report.json
          BETA_FIXTURE_DIR=test-results/beta-historical node tests/beta-campaign-browser.test.cjs
      - name: Verify WebKit quest completion and Keeper Archive
        if: steps.scope.outputs.docs_only != 'true'
        env:
          QUEST_BROWSER_ENGINE: webkit
        run: node tests/quest-archive-browser.test.cjs
      - name: Audit integrated rogue warnings and effects in WebKit
        if: steps.scope.outputs.docs_only != 'true'
        env:
          ROGUE_BROWSER_ENGINE: webkit
        run: node tests/rogue-browser.test.cjs
      - name: Verify WebKit audio playback and lifecycle
        if: steps.scope.outputs.docs_only != 'true'
        env:
          AUDIO_BROWSER_ENGINE: webkit
        run: |
          node tests/audio-browser.test.cjs
          node tests/audio-audition-browser.test.cjs
      - name: Verify WebKit enemy VFX catalog and pilot captures
        if: steps.scope.outputs.docs_only != 'true'
        env:
          VFX_BROWSER_ENGINE: webkit
        run: |
          node tests/enemy-vfx-browser.test.cjs
          VFX_CAPTURE_TAG=webkit-ci VFX_CAPTURE_SMOKE=1 node scripts/enemy-vfx-capture.cjs
      - name: Verify WebKit original-master actor idles and combat
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          node scripts/sprite-production-browser-review.cjs local test-results/sprite-pilot-webkit webkit
          node scripts/sprite-nature-browser-review.cjs local test-results/sprite-nature-webkit webkit
      - name: Verify WebKit terrain material rendering
        if: steps.scope.outputs.docs_only != 'true'
        env:
          MATERIAL_BROWSER_ENGINE: webkit
        run: |
          node tests/materials-browser.test.cjs
          node tests/ground-cache-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: webkit-phone-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore

  main-test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run full game checks
        uses: ./.github/actions/check-game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          retention-days: 3
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare app files
        run: node scripts/build.cjs --check --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [main-test, phone-webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Use runner Chrome for live smoke verification
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            echo "CHROMIUM_EXECUTABLE=$CHROME" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Wait for the exact published build
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..30}; do
            PUBLISHED="$(curl -fsSL -H 'Cache-Control: no-cache' "${PLAYTEST_URL}build.txt?sha=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if [ "${PUBLISHED}" = "${GITHUB_SHA}" ]; then
              echo "Published build matches commit ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for GitHub Pages propagation (${attempt}/30)…"
            sleep 4
          done
          echo "Published site did not reach commit ${GITHUB_SHA} in time."
          exit 1
      - name: Verify published desktop and phone smoke paths
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_SMOKE: '1'
        run: node tests/prototype-browser.test.cjs
      - name: Verify published original-master actor idles and roads
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/sprite-production-browser-review.cjs "$PLAYTEST_URL" test-results/sprite-pilot-live chromium
          node scripts/sprite-nature-browser-review.cjs "$PLAYTEST_URL" test-results/sprite-nature-live chromium
      - name: Verify published quest completion and Keeper Archive
        env:
          PLAYTEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/quest-archive-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-app-screenshots
          path: test-results/
          if-no-files-found: ignore

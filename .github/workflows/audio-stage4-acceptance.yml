name: Stage 4 music and mix acceptance

# Stage 4-only focused policy checks. No speaker claims, no deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/audio-stage4-mix-matrix.test.cjs'
      - 'tests/audio-stage4-browser-smoke.test.cjs'
      - 'tools/audio/index.html'
      - '.github/workflows/audio-stage4-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: audio-stage4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  music-mix:
    if: github.event.pull_request.head.ref == 'audit/audio-stage4-music-mix-20261025' || github.event.pull_request.head.ref == 'docs/development-state-clear-status-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tools
        run: npm ci --ignore-scripts
      - name: Stage 4 scene, music, bus and optimization policy matrix
        run: node tests/audio-stage4-mix-matrix.test.cjs
      - name: Existing authored soundtrack selection and stem behavior
        run: node tests/audio-production.test.cjs
      - name: Existing environmental source transitions
        run: node tests/audio-environment.test.cjs
      - name: Existing recording and fallback integrity
        run: node tests/audio-recordings.test.cjs
      - name: Existing optimization source suppression and restoration
        run: node tests/optimization-mode.test.cjs
      - name: Existing procedural scheduling regressions
        run: node tests/audio-scheduler.test.cjs

  recorded-audition-browser:
    if: github.event.pull_request.head.ref == 'audit/audio-stage4-music-mix-20261025' || github.event.pull_request.head.ref == 'docs/development-state-clear-status-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked tools
        run: npm ci --ignore-scripts
      - name: Prepare Chromium for narrow audio audition
        shell: bash
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo 'CHROMIUM_EXECUTABLE=/usr/bin/google-chrome' >> "$GITHUB_ENV"
          elif [ -x /usr/bin/chromium ]; then
            echo 'CHROMIUM_EXECUTABLE=/usr/bin/chromium' >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Prepare same-origin pinned PixiJS for offline audition acceptance
        if: github.event.pull_request.head.ref == 'docs/development-state-clear-status-20261028'
        run: node scripts/vendor-pixi.cjs --ensure
      - name: Verify real decoded PCM and authored MP3 mix on desktop and phone-sized Chromium
        run: node tests/audio-stage4-browser-smoke.test.cjs
      - name: Release-candidate audition room desktop and phone Chromium acceptance
        if: github.event.pull_request.head.ref == 'docs/development-state-clear-status-20261028'
        run: node tests/audio-audition-browser.test.cjs
      - name: Upload audio audition failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audio-stage4-browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore

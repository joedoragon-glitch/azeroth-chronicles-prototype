name: Art 321 isolated night Canvas Pixi parity
# Exactly one real Chromium software-WebGL2 night scene: 420 s of authored
# day cycle. Existing daytime capture remains a separate, unchanged contract.
# No gameplay matrix, release, deployment or live asset approval.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/visual-review/art321-crown-loot-browser.cjs'
      - '.github/workflows/art321-night-capture.yml'
permissions:
  contents: read
concurrency:
  group: art321-night-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frozen-night-coin:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install only locked test dependencies
        run: npm ci --ignore-scripts
      - name: Capture one matched paused night scene at 150% zoom
        run: |
          mkdir -p "$RUNNER_TEMP/art321-night"
          ART321_SCENE_CLOCK=420 ART321_OUTPUT="$RUNNER_TEMP/art321-night" node tools/visual-review/art321-crown-loot-browser.cjs
      - name: Save real night PNGs and identical-source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art321-night-coin-${{ github.sha }}
          path: ${{ runner.temp }}/art321-night/
          if-no-files-found: warn
          retention-days: 14

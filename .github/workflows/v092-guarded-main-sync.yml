# One-time, nonpublishing merge of reviewed current main into draft tutorial PR.
# Only runs for its unique creation commit; never touches main or Pages.
name: v0.9.2 guarded main reconciliation (one-time)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: [.github/workflows/v092-guarded-main-sync.yml]

permissions:
  contents: write

concurrency:
  group: v092-guarded-main-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event.head_commit.message == 'ci(tutorial): guarded integrate current main dev290' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact heads and merge only into the draft branch
        shell: bash
        env:
          EXPECTED_MAIN: 37ef6b0f86d91e2cc9af92c3660c757855200d33
          BRANCH: feat/v092-tutorial-quest-chain-20261112
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'SIBDLP integration CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$EXPECTED_MAIN" || {
            test -f "$(git rev-parse --git-path MERGE_HEAD)"
          }
          while IFS= read -r conflict; do
            case "$conflict" in
              docs/DEVELOPMENT_STATE.md|docs/evidence/SPRITE_SCOPE_RECONCILIATION.json|sw.js)
                git checkout --ours -- "$conflict" ;;
              *) echo "Unexpected merge conflict: $conflict"; exit 1 ;;
            esac
          done < <(git diff --name-only --diff-filter=U)
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const previous = process.env.GITHUB_SHA;
          const main = process.env.EXPECTED_MAIN;
          const show = (ref, file) =>
            cp.execFileSync('git', ['show', ref + ':' + file], { encoding: 'utf8' });
          // Preserve the draft's authorial/tutorial record, update main's two
          // current-version slots, and retain that source is not published.
          const path = 'docs/DEVELOPMENT_STATE.md';
          let doc = show(previous, path);
          const change = (pattern, value, label) => {
            if (!pattern.test(doc)) throw Error('Missing exact ' + label + ' source marker');
            doc = doc.replace(pattern, value);
          };
          change(/<!-- CURRENT_BUILD_VERSION: 0\.9\.1\+snapshot\.dev\.289 -->/,
            '<!-- CURRENT_BUILD_VERSION: 0.9.1+snapshot.dev.290 -->', 'build marker');
          change(/^\*\*Current code\/build version:\*\* .+$/m,
            '**Current code/build version:** `0.9.1+snapshot.dev.290` — source integrated from reviewed sound-stage #888 and shadow #894 main merges, both marked [no-pages]. Player-facing Pages/PWA publication and device uptake remain unverified. v0.9.2 is a separate future milestone.',
            'current version');
          change(/^\| Build\/cache version \|.+$/m,
            '| Build/cache version | **`0.9.1+snapshot.dev.290`** — source integrated from main without publication | Generated build metadata and worker must match; real Pages/device adoption is separate evidence. |',
            'build table');
          doc =
            '> **16 November 2026 — tutorial candidate reconciled with main dev.290, NOT PUBLISHED:** Current main includes separately reviewed sound-stage #888 and shadow #894 changes, plus explicit [no-pages] merge protection. PR #868 preserves its approved tutorial and class/menu work on its draft branch; whole-campaign and physical-device acceptance remain separate.\n\n' +
            doc;
          fs.writeFileSync(path, doc);
          // Reviewed canon evidence: main updated visual art, tutorial updated
          // renderer presentation. Preserve both source fingerprints and the
          // entire previously approved sprite family/decision catalog.
          const evidencePath = 'docs/evidence/SPRITE_SCOPE_RECONCILIATION.json';
          const ours = JSON.parse(show(previous, evidencePath));
          const theirs = JSON.parse(show(main, evidencePath));
          const a = Object.keys(ours.sources).sort();
          const b = Object.keys(theirs.sources).sort();
          if (JSON.stringify(a) !== JSON.stringify(b))
            throw Error('Sprite source inventory changed; human review required');
          const changed = a.filter((key) => ours.sources[key] !== theirs.sources[key]);
          if (JSON.stringify(changed) !==
              JSON.stringify(['src/prototype/renderer.js', 'src/prototype/visuals.js']))
            throw Error('Unexpected sprite source drift: ' + changed.join(', '));
          ours.sources['src/prototype/visuals.js'] = theirs.sources['src/prototype/visuals.js'];
          fs.writeFileSync(evidencePath, JSON.stringify(ours, null, 2) + '\n');
          NODE
          git add docs/DEVELOPMENT_STATE.md docs/evidence/SPRITE_SCOPE_RECONCILIATION.json
          test -z "$(git diff --name-only --diff-filter=U)" || {
            git diff --name-only --diff-filter=U; exit 1;
          }
      - run: npm ci --ignore-scripts
      - name: Regenerate ALL combined-source runtime and PWA fingerprints
        run: |
          node scripts/build.cjs
          node scripts/build.cjs --check
      - name: Verify integrated sprite, tutorial, saves and no-Pages contract
        run: |
          node tests/sprite-scope.test.cjs
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/pages-publication-guard.test.cjs
          node tests/docs-release-consistency.test.cjs
          node scripts/docs-release-consistency.cjs
      - name: Commit a genuine two-parent merge on the feature branch only
        shell: bash
        env:
          EXPECTED_MAIN: 37ef6b0f86d91e2cc9af92c3660c757855200d33
          BRANCH: feat/v092-tutorial-quest-chain-20261112
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git diff --cached --check
          git commit -m "merge(v0.9.2): integrate current main dev290 audio and shadow without publication [no-pages]"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "Verified nonpublishing two-parent integration $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

name: v0.9.2 dev.291 guarded source integration (one-time, no deploy)
on:
  push:
    branches: [feat/v092-tutorial-quest-chain-20261112]
    paths: [.github/workflows/v092-dev291-guarded-sync.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: "github.event.head_commit.message == 'ci(v092): guarded reconcile dev291 automatic loading recovery'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reconcile only reviewed conflicts into tutorial branch, never main
        shell: bash
        env:
          EXPECTED_MAIN: fd016b044b94cd085f86d869ada7803905c82ec2
          BRANCH: feat/v092-tutorial-quest-chain-20261112
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN" || { echo "::error::Main moved; re-review required"; exit 1; }
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA" || { echo "::error::Tutorial head moved; avoid overwriting concurrent work"; exit 1; }
          git config user.name 'SIBDLP integration reviewer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$EXPECTED_MAIN" || true
          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf 'docs/DEVELOPMENT_STATE.md\ndocs/evidence/SPRITE_SCOPE_RECONCILIATION.json\nsw.js\ntests/helpers/production-shell.cjs')"
          if [ "$conflicts" != "$expected" ]; then
            echo "::error::Unexpected conflicts; refuse automatic reconciliation"
            printf '%s\n' "$conflicts"
            exit 1
          fi
          # New main owns the actual 60s image/120s GPU recovery timer
          # instrumentation. No tutorial test may stub those timers away.
          git checkout --theirs tests/helpers/production-shell.cjs
          # The renderer source is owned by the tutorial UI branch, while main
          # owns the newer image watchdog sprite implementation.
          git checkout --ours docs/evidence/SPRITE_SCOPE_RECONCILIATION.json
          # The PWA cache is GENERATED from the combined real source, never
          # resolved by selecting one side's stale fingerprints.
          git checkout --ours sw.js
          git checkout --ours docs/DEVELOPMENT_STATE.md
          node <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const show = (ref, file) => cp.execFileSync('git',['show', ref + ':' + file],{encoding:'utf8'});
          const ourEvidence = JSON.parse(fs.readFileSync('docs/evidence/SPRITE_SCOPE_RECONCILIATION.json','utf8'));
          const mainEvidence = JSON.parse(show(process.env.EXPECTED_MAIN, 'docs/evidence/SPRITE_SCOPE_RECONCILIATION.json'));
          const a = Object.keys(ourEvidence.sources).sort(), b = Object.keys(mainEvidence.sources).sort();
          if (JSON.stringify(a) !== JSON.stringify(b)) throw Error('Sprite source inventory changed; manual review necessary');
          const drift = a.filter(key => ourEvidence.sources[key] !== mainEvidence.sources[key]).sort();
          if (JSON.stringify(drift) !== JSON.stringify(['src/prototype/renderer.js','src/prototype/sprites.js']))
            throw Error('Unexpected source drift: ' + drift);
          ourEvidence.sources['src/prototype/sprites.js'] = mainEvidence.sources['src/prototype/sprites.js'];
          fs.writeFileSync('docs/evidence/SPRITE_SCOPE_RECONCILIATION.json',JSON.stringify(ourEvidence,null,2)+'\n');
          const path = 'docs/DEVELOPMENT_STATE.md';
          let doc = fs.readFileSync(path,'utf8');
          const old = '<!-- CURRENT_BUILD_VERSION: 0.9.1+snapshot.dev.290 -->';
          if (!doc.includes(old)) throw Error('Unexpected source version marker');
          doc = doc.replace(old,'<!-- CURRENT_BUILD_VERSION: 0.9.1+snapshot.dev.291 -->');
          doc = doc.replace(/^\*\*Current code\/build version:\*\*.*$/m,
            '**Current code/build version:** `0.9.1+snapshot.dev.291` — current `main` contains the owner-reviewed loading recovery and sprite watchdog fix from #897, merged source-only without player publication. This tutorial candidate integrates that main code without changing the v0.9.2 release milestone. Public Pages/PWA adoption is independently verified.');
          doc = doc.replace(/^\| Build\/cache version \|.*$/m,
            '| Build/cache version | **`0.9.1+snapshot.dev.291`** — reviewed current main and tutorial candidate | Source build metadata and generated offline cache must match; no inferred installed-device update. |');
          const mainDocs = show(process.env.EXPECTED_MAIN,path);
          if (!mainDocs.includes('PR #897 dev.291')) throw Error('Main loading recovery provenance changed');
          const header = '> **16 November 2026 — tutorial branch incorporates reviewed dev.291 loading recovery (not yet published):** PR #868 reconciles newer `main` including automatic Canvas fallback with no player-facing manual bypass and stalled sprite/GPU recovery. Preserve the existing title, save, four-class tutorials, all-menu density and Pixi/Canvas behavior. Test evidence and future Pages release are separate. This paragraph supersedes older draft-only status summaries; release authorization requires final combined-source green checks.\n\n';
          fs.writeFileSync(path,header+doc);
          NODE
          git add docs/DEVELOPMENT_STATE.md docs/evidence/SPRITE_SCOPE_RECONCILIATION.json tests/helpers/production-shell.cjs sw.js
          test -z "$(git diff --name-only --diff-filter=U)" || { echo "::error::Unresolved conflicts"; exit 1; }
          node scripts/build.cjs
          node scripts/build.cjs --check
          node tests/pages-publication-guard.test.cjs
          node tests/sprite-scope.test.cjs
          node tests/tutorial-quest-chain-v092.test.cjs
          node tests/tutorial-quest-chain-ui-v092.test.cjs
          node tests/tutorial-board-gather-ui-v092.test.cjs
          node tests/v092-elite-auto-initiation.test.cjs
          node tests/character-language-consistency-v092.test.cjs
          node tests/platform-runtime.test.cjs
          node tests/scene-transition-lifecycle.test.cjs
          node tests/sprite-lifecycle.test.cjs
          node tests/docs-release-consistency.test.cjs
          node scripts/docs-release-consistency.cjs
          git add -A -- . ':!assets/vendor/pixi-8.22.0.min.js'
          git diff --cached --check
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA" || { echo "::error::Concurrent tutorial change; refuse push"; exit 1; }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN" || { echo "::error::Current main moved"; exit 1; }
          git commit -m "merge(v092): integrate dev.291 recovery and preserve tutorial source"
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "PASS guarded source integration $(git rev-parse HEAD)"

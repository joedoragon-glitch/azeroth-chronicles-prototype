name: PR573 regional cache browser audit
# One-off feature audit under explicit owner authorization. Never deploy.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  experimental-chromium:
    if: github.event.pull_request.number == 573
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium browser support
        run: npx playwright install --with-deps chromium
      - name: Prepare pinned Pixi bundle
        run: node scripts/vendor-pixi.cjs --ensure
      - name: Exercise the actual experimental Pixi renderer and Canvas fallback
        env:
          BROWSER_ENGINE: chromium
        run: node tests/pixi-renderer-browser.test.cjs

name: PR471 read-only cross-draft native gate

# Limited compatibility evidence only, not a merge, full suite or deployment.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/effects/pr471-cross-pr-gate.cjs'
      - '.github/workflows/pr471-cross-pr-gate.yml'
permissions:
  contents: read
concurrency:
  group: pr471-readonly-cross-draft
  cancel-in-progress: true
jobs:
  selected-native-combinations:
    if: github.event.pull_request.number == 471 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to a synthetic merge ref. Pin the actual
          # draft source head instead so attribution is unambiguous.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts
      - name: Probe exact GitHub PR heads in disposable trees only
        run: |
          mkdir -p compat-reports
          node tools/effects/pr471-cross-pr-gate.cjs compat-reports/pr471-cross-drafts.json
      - name: Keep pinned SHA evidence, including blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr471-readonly-cross-drafts
          path: compat-reports/
          retention-days: 14
          if-no-files-found: warn

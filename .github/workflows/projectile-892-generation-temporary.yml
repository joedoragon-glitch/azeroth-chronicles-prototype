name: Temporary #892 deterministic build-fingerprint generation
# Internal one-PR maintenance; remove before merge. Never publishes a site.
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  generate:
    if: ${{ github.event.pull_request.number == 899 && github.event.pull_request.head.ref == 'fix/v092-projectile-flight-coherence-892' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate deterministic build outputs without publishing
        run: node scripts/build.cjs
      - name: Reject unrelated generated mutations
        shell: bash
        run: |
          git status --short
          if git diff --name-only | grep -v -E '^sw[.]js$' | grep -q .; then
            echo "::error::Unexpected generated file changed"
            exit 1
          fi
      - name: Commit only exact generated service-worker fingerprints to draft branch
        shell: bash
        run: |
          git add sw.js
          if git diff --cached --quiet; then
            echo "Source fingerprints already match; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize #892 source fingerprints on isolated branch [no-pages]"
          git push origin HEAD:refs/heads/fix/v092-projectile-flight-coherence-892

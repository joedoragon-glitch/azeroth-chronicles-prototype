name: Art 321 isolated Canvas/Pixi visual capture

# One controlled Chromium software-WebGL2 correctness capture. No full game,
# browser matrix, gameplay tests, website publishing or renderer code changes.
# PR-only and path-scoped; the source branch stays draft and unmerged.
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/visual-review/art321-crown-loot-browser.cjs'
      - '.github/workflows/art321-paired-capture.yml'

permissions:
  contents: read

concurrency:
  group: art321-paired-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  crown-loot-pair:
    name: One paired native-browser capture
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked test tooling
        run: npm ci --ignore-scripts
      - name: Capture one paused Campaign in Canvas and real WebGL2
        run: |
          mkdir -p "$RUNNER_TEMP/art321-pair"
          ART321_OUTPUT="$RUNNER_TEMP/art321-pair" node tools/visual-review/art321-crown-loot-browser.cjs
      - name: Preserve page-composited PNGs and reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art321-crown-loot-paired-${{ github.sha }}
          path: ${{ runner.temp }}/art321-pair/
          if-no-files-found: warn
          retention-days: 14
